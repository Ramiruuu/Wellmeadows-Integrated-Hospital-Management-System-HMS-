<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Wellmeadows</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f2b3d 0%, #1a4a6e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .login-container {
            background: white;
            border-radius: 28px;
            width: 100%;
            max-width: 460px;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
        }
        .login-header {
            background: #0f2b3d;
            padding: 36px;
            text-align: center;
        }
        .login-header h1 { color: white; font-size: 1.6rem; margin-bottom: 8px; }
        .login-header p { color: #94a3b8; font-size: 0.85rem; }
        .login-body { padding: 36px; }
        .form-group { margin-bottom: 24px; }
        label { display: block; font-weight: 600; font-size: 0.7rem; color: #475569; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
        .input-wrapper { position: relative; }
        .input-wrapper i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #94a3b8; font-size: 1rem; }
        input {
            width: 100%;
            padding: 14px 16px 14px 46px;
            border: 1.5px solid #e2e8f0;
            border-radius: 14px;
            font-size: 0.9rem;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s;
        }
        input:focus { outline: none; border-color: #287b9e; box-shadow: 0 0 0 3px rgba(40,123,158,0.1); }
        .btn-login {
            width: 100%;
            background: #287b9e;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 0.9rem;
            transition: all 0.2s;
        }
        .btn-login:hover { background: #1a5f7a; transform: translateY(-1px); }
        .alert { padding: 14px; border-radius: 14px; margin-bottom: 24px; font-size: 0.85rem; display: flex; align-items: center; gap: 10px; }
        .alert-error { background: #fee2e2; color: #b91c1c; border: 1px solid #fecaca; }
        .alert-success { background: #dcfce7; color: #15803d; border: 1px solid #bbf7d0; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>Admin Portal</h1>
            <p>Wellmeadows Hospital Management System</p>
        </div>
        <div class="login-body">
            <div id="alertMessage" class="alert hidden"></div>
            <form id="loginForm">
                <div class="form-group">
                    <label>Email Address</label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="email" placeholder="admin@wellmeadows.com" autocomplete="off" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" placeholder="Enter your password" required>
                    </div>
                </div>
                <button type="submit" class="btn-login">
                    <i class="fas fa-sign-in-alt"></i> Sign In
                </button>
            </form>
        </div>
    </div>

    <script>
        // IMPORTANT: Use a different variable name, not 'supabase'
        const SUPABASE_URL = 'https://cqetejeaeasqkafdgjri.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_75JVFc0QWySSyAPQVO-C1g_Udqt9tgQ';
        
        // Use 'supabaseClient' instead of 'supabase' to avoid conflict
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const form = document.getElementById('loginForm');
        const alertDiv = document.getElementById('alertMessage');

        function showAlert(message, type) {
            alertDiv.className = `alert alert-${type}`;
            alertDiv.innerHTML = `<i class="fas fa-${type === 'error' ? 'exclamation-circle' : 'check-circle'}"></i> ${message}`;
            alertDiv.classList.remove('hidden');
            setTimeout(() => alertDiv.classList.add('hidden'), 5000);
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            console.log('Attempting login with:', email);
            showAlert('Logging in...', 'success');
            
            try {
                const { data: authData, error: authError } = await supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: password
                });
                
                if (authError) throw authError;
                
                console.log('Auth success:', authData.user);
                
                const { data: staffData, error: staffError } = await supabaseClient
                    .from('staff')
                    .select('*')
                    .eq('email', email)
                    .single();
                
                if (staffError || !staffData) {
                    console.log('Staff check failed:', staffError);
                    await supabaseClient.auth.signOut();
                    showAlert('Access denied. You are not authorized as staff.', 'error');
                    return;
                }
                
                console.log('Staff found:', staffData);
                
                sessionStorage.setItem('adminEmail', staffData.email);
                sessionStorage.setItem('adminName', `${staffData.first_name} ${staffData.last_name}`);
                sessionStorage.setItem('adminRole', staffData.position);
                
                showAlert('Login successful! Redirecting...', 'success');
                
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1500);
                
            } catch (error) {
                console.error('Login error:', error);
                let errorMsg = error.message;
                if (errorMsg.includes('Invalid login')) {
                    errorMsg = 'Invalid email or password. Please try again.';
                }
                showAlert(errorMsg, 'error');
            }
        });
    </script>
</body>
</html>
