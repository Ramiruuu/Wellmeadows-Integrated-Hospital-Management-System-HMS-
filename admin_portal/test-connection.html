<!DOCTYPE html>
<html>
<head>
    <title>Test Supabase Connection</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <h2>Supabase Connection Test</h2>
    <div id="output"></div>

    <script>
        // Use a DIFFERENT variable name, not 'supabase'
        const SUPABASE_URL = 'https://cqetejeaeasqkafdgjri.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_75JVFc0QWySSyAPQVO-C1g_Udqt9tgQ';
        
        // Use 'supabaseClient' instead of 'supabase'
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        const output = document.getElementById('output');
        
        async function test() {
            output.innerHTML = 'Testing connection...<br>';
            
            // Test 1: Check staff table
            const { data: staff, error: err1 } = await supabaseClient.from('staff').select('*').limit(3);
            if (err1) {
                output.innerHTML += `❌ Staff table error: ${err1.message}<br>`;
            } else {
                output.innerHTML += `✅ Staff table: ${staff?.length || 0} records found<br>`;
                if (staff && staff.length > 0) {
                    output.innerHTML += `<pre>${JSON.stringify(staff, null, 2)}</pre><br>`;
                }
            }
            
            // Test 2: Check patient table
            const { data: patients, error: err2 } = await supabaseClient.from('patient').select('*').limit(3);
            if (err2) {
                output.innerHTML += `❌ Patient table error: ${err2.message}<br>`;
            } else {
                output.innerHTML += `✅ Patient table: ${patients?.length || 0} records found<br>`;
            }
            
            // Test 3: Check appointment table
            const { data: appointments, error: err3 } = await supabaseClient.from('appointment').select('*').limit(3);
            if (err3) {
                output.innerHTML += `❌ Appointment table error: ${err3.message}<br>`;
            } else {
                output.innerHTML += `✅ Appointment table: ${appointments?.length || 0} records found<br>`;
            }
            
            // Test 4: Get appointment counts by status
            const { data: statusCounts, error: err4 } = await supabaseClient
                .from('appointment')
                .select('status');
            
            if (err4) {
                output.innerHTML += `❌ Status query error: ${err4.message}<br>`;
            } else {
                const counts = {};
                statusCounts?.forEach(s => { counts[s.status] = (counts[s.status] || 0) + 1; });
                output.innerHTML += `<br>✅ Appointment status breakdown:<br>`;
                output.innerHTML += `<pre>${JSON.stringify(counts, null, 2)}</pre>`;
            }
        }
        
        test();
    </script>
</body>
</html>
