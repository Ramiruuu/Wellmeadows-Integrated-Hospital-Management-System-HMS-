<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports - Wellmeadows Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: #f1f5f9;
        }

        /* Sidebar Styles */
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            height: 100%;
            width: 280px;
            background: linear-gradient(180deg, #0f2b3d 0%, #0a1e2c 100%);
            color: #e2e8f0;
            transition: all 0.3s;
            z-index: 100;
            overflow-y: auto;
        }
        .sidebar.closed {
            width: 80px;
        }
        .sidebar.closed .sidebar-nav span,
        .sidebar.closed .logo-text,
        .sidebar.closed .logo-sub,
        .sidebar.closed .user-details {
            display: none;
        }
        .sidebar.closed .sidebar-nav .nav-item {
            justify-content: center;
            padding: 12px;
        }
        .sidebar-header {
            padding: 24px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .logo-icon {
            font-size: 2rem;
            color: #4db8ff;
        }
        .logo-text {
            font-size: 1.3rem;
            font-weight: 700;
            color: white;
        }
        .logo-sub {
            font-size: 0.7rem;
            color: #94a3b8;
            margin-top: 6px;
            padding-left: 52px;
        }
        .toggle-btn {
            position: absolute;
            top: 20px;
            right: -12px;
            background: #287b9e;
            border: 2px solid #0f2b3d;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: white;
            z-index: 101;
        }
        .sidebar-nav {
            padding: 0 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 16px;
            border-radius: 12px;
            color: #cbd5e6;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.9rem;
            transition: all 0.2s;
        }
        .nav-item i {
            width: 24px;
        }
        .nav-item:hover {
            background: rgba(77, 184, 255, 0.12);
            color: white;
        }
        .nav-item.active {
            background: #287b9e;
            color: white;
        }
        .sidebar-footer {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }
        .user-avatar {
            width: 40px;
            height: 40px;
            background: #287b9e;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .user-name {
            font-weight: 600;
            font-size: 0.85rem;
            color: white;
        }
        .logout-btn {
            width: 100%;
            background: rgba(220, 38, 38, 0.2);
            border: none;
            color: #fca5a5;
            padding: 10px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .logout-btn:hover {
            background: rgba(220, 38, 38, 0.4);
            color: white;
        }

        /* Main Content */
        .main-content {
            margin-left: 280px;
            padding: 24px 32px;
            transition: all 0.3s;
            min-height: 100vh;
        }
        .main-content.expanded {
            margin-left: 80px;
        }
        .page-header {
            margin-bottom: 32px;
        }
        .page-header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            color: #0f2b3d;
            margin-bottom: 8px;
        }
        .page-header p {
            color: #64748b;
            font-size: 0.9rem;
        }

        /* Card */
        .card {
            background: white;
            border-radius: 20px;
            padding: 24px;
            border: 1px solid #e2e8f0;
        }
        .filter-row {
            display: flex;
            gap: 16px;
            align-items: flex-end;
            flex-wrap: wrap;
            margin-bottom: 24px;
        }
        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .filter-group label {
            font-size: 0.75rem;
            font-weight: 600;
            color: #475569;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .filter-group input {
            padding: 10px 16px;
            border: 1.5px solid #e2e8f0;
            border-radius: 12px;
            font-size: 0.9rem;
            font-family: 'Inter', sans-serif;
        }
        .filter-group input:focus {
            outline: none;
            border-color: #287b9e;
        }
        .btn-primary {
            background: #287b9e;
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.85rem;
        }
        .btn-primary:hover {
            background: #1a5f7a;
        }

        /* Stats */
        .stats-summary {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 24px;
        }
        .summary-item {
            background: #f8fafc;
            padding: 20px;
            border-radius: 16px;
            text-align: center;
            border: 1px solid #e2e8f0;
        }
        .summary-item .value {
            font-size: 1.8rem;
            font-weight: 700;
            color: #287b9e;
        }
        .summary-item .label {
            font-size: 0.7rem;
            color: #64748b;
            margin-top: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Table */
        .table-wrapper {
            overflow-x: auto;
            margin-top: 24px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #eef2f8;
            font-size: 0.85rem;
        }
        th {
            background: #f8fafc;
            font-weight: 600;
            color: #0f2b3d;
        }
        .empty-state {
            text-align: center;
            padding: 48px;
            color: #94a3b8;
        }

        /* Button Group */
        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 24px;
            justify-content: flex-end;
        }
        .btn-pdf {
            background: #dc2626;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-pdf:hover {
            background: #b91c1c;
        }
        .btn-excel {
            background: #059669;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-excel:hover {
            background: #047857;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .sidebar {
                width: 80px;
            }
            .sidebar .logo-text,
            .sidebar .logo-sub,
            .sidebar .user-details {
                display: none;
            }
            .sidebar .nav-item {
                justify-content: center;
                padding: 12px;
            }
            .sidebar .nav-item span {
                display: none;
            }
            .main-content {
                margin-left: 80px;
                padding: 20px;
            }
            .stats-summary {
                grid-template-columns: 1fr;
            }
            .filter-row {
                flex-direction: column;
                align-items: stretch;
            }
        }
    </style>
</head>
<body>

<aside class="sidebar" id="sidebar">
    <div class="toggle-btn" id="toggleSidebar">
        <i class="fas fa-chevron-left"></i>
    </div>
    <div class="sidebar-header">
        <div class="logo-area">
            <i class="fas fa-hospital-user logo-icon"></i>
            <div class="logo-text">Wellmeadows</div>
        </div>
        <div class="logo-sub">Admin Portal</div>
    </div>
    <nav class="sidebar-nav">
        <a href="index.html" class="nav-item"><i class="fas fa-chalkboard-user"></i><span>Dashboard</span></a>
        <a href="appointments.html" class="nav-item"><i class="fas fa-calendar-check"></i><span>Appointments</span></a>
        <a href="calendar.html" class="nav-item"><i class="fas fa-calendar-alt"></i><span>Calendar</span></a>
        <a href="patients.html" class="nav-item"><i class="fas fa-users"></i><span>Patients</span></a>
        <a href="staff-schedule.html" class="nav-item"><i class="fas fa-user-md"></i><span>Staff Schedule</span></a>
        <a href="reports.html" class="nav-item active"><i class="fas fa-chart-line"></i><span>Reports</span></a>
    </nav>
    <div class="sidebar-footer">
        <div class="user-info">
            <div class="user-avatar"><i class="fas fa-user-circle"></i></div>
            <div class="user-details">
                <div class="user-name" id="adminName">Admin</div>
            </div>
        </div>
        <button class="logout-btn" id="logoutBtn">Logout</button>
    </div>
</aside>

<main class="main-content" id="mainContent">
    <div class="page-header">
        <h1>Reports & Analytics</h1>
        <p>Generate and export appointment reports</p>
    </div>

    <div class="card">
        <div class="filter-row">
            <div class="filter-group">
                <label>Start Date</label>
                <input type="date" id="startDate">
            </div>
            <div class="filter-group">
                <label>End Date</label>
                <input type="date" id="endDate">
            </div>
            <button class="btn-primary" onclick="loadReport()">Generate Report</button>
        </div>

        <div class="stats-summary">
            <div class="summary-item">
                <div class="value" id="totalAppointments">0</div>
                <div class="label">Total Appointments</div>
            </div>
            <div class="summary-item">
                <div class="value" id="totalPatients">0</div>
                <div class="label">Unique Patients</div>
            </div>
            <div class="summary-item">
                <div class="value" id="totalRevenue">₱0</div>
                <div class="label">Revenue</div>
            </div>
        </div>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Patient Name</th>
                        <th>Doctor Name</th>
                        <th>Status</th>
                        <th>Reason</th>
                    </tr>
                </thead>
                <tbody id="reportTable">
                    <tr>
                        <td colspan="5" class="empty-state">Select date range and click Generate Report</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="button-group">
            <button class="btn-pdf" onclick="exportToPDF()">Export to PDF</button>
            <button class="btn-excel" onclick="exportToExcel()">Export to Excel</button>
        </div>
    </div>
</main>

<script>
    const SUPABASE_URL = 'https://cqetejeaeasqkafdgjri.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_75JVFc0QWySSyAPQVO-C1g_Udqt9tgQ';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentReportData = [];

    // Set default dates (last 30 days)
    function setDefaultDates() {
        const endDate = new Date();
        const startDate = new Date();
        startDate.setDate(startDate.getDate() - 30);
        
        document.getElementById('startDate').value = startDate.toISOString().split('T')[0];
        document.getElementById('endDate').value = endDate.toISOString().split('T')[0];
    }

    async function loadReport() {
        let startDate = document.getElementById('startDate').value;
        let endDate = document.getElementById('endDate').value;
        
        if (!startDate || !endDate) {
            setDefaultDates();
            startDate = document.getElementById('startDate').value;
            endDate = document.getElementById('endDate').value;
        }
        
        console.log('Fetching appointments from', startDate, 'to', endDate);
        
        // Fetch appointments with patient and doctor details
        const { data: appointments, error } = await supabaseClient
            .from('appointment')
            .select('*')
            .gte('appointment_date', startDate)
            .lte('appointment_date', endDate)
            .order('appointment_date', { ascending: true });
        
        if (error) {
            console.error('Error fetching appointments:', error);
            document.getElementById('reportTable').innerHTML = '<tr><td colspan="5" class="empty-state">Error loading data</td></tr>';
            return;
        }
        
        console.log('Appointments found:', appointments?.length || 0);
        
        if (!appointments || appointments.length === 0) {
            document.getElementById('reportTable').innerHTML = '<tr><td colspan="5" class="empty-state">No appointments found for selected date range</td></tr>';
            document.getElementById('totalAppointments').textContent = '0';
            document.getElementById('totalPatients').textContent = '0';
            document.getElementById('totalRevenue').textContent = '₱0';
            currentReportData = [];
            return;
        }
        
        // Fetch all patients and staff for mapping
        const [patientsRes, staffRes] = await Promise.all([
            supabaseClient.from('patient').select('patient_id, first_name, last_name'),
            supabaseClient.from('staff').select('staff_id, first_name, last_name')
        ]);
        
        const patientMap = {};
        patientsRes.data?.forEach(p => {
            patientMap[p.patient_id] = `${p.first_name} ${p.last_name}`;
        });
        
        const staffMap = {};
        staffRes.data?.forEach(s => {
            staffMap[s.staff_id] = `Dr. ${s.first_name} ${s.last_name}`;
        });
        
        // Build report data
        currentReportData = appointments.map(apt => ({
            date: apt.appointment_date,
            patient_name: patientMap[apt.patient_id] || 'Unknown Patient',
            doctor_name: staffMap[apt.staff_id] || 'Unknown Doctor',
            status: apt.status || 'Scheduled',
            reason: apt.reason || '-'
        }));
        
        // Calculate statistics
        const totalAppointments = currentReportData.length;
        const uniquePatients = new Set(appointments.map(a => a.patient_id)).size;
        const totalRevenue = totalAppointments * 800;
        
        document.getElementById('totalAppointments').textContent = totalAppointments;
        document.getElementById('totalPatients').textContent = uniquePatients;
        document.getElementById('totalRevenue').textContent = `₱${totalRevenue.toLocaleString()}`;
        
        // Render table
        const tbody = document.getElementById('reportTable');
        tbody.innerHTML = currentReportData.map(row => `
            <tr>
                <td>${row.date}</td>
                <td><strong>${row.patient_name}</strong></td>
                <td>${row.doctor_name}</td>
                <td><span style="background: #f1f5f9; padding: 4px 10px; border-radius: 20px; font-size: 0.7rem;">${row.status}</span></td>
                <td>${row.reason}</td>
            </tr>
        `).join('');
    }

    function exportToPDF() {
        if (!currentReportData || currentReportData.length === 0) {
            alert('No data to export. Please generate a report first.');
            return;
        }
        
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF('landscape');
        
        // Header
        doc.setFillColor(15, 43, 61);
        doc.rect(0, 0, 297, 45, 'F');
        doc.setTextColor(255, 255, 255);
        doc.setFontSize(20);
        doc.text('Wellmeadows Hospital - Appointment Report', 20, 28);
        
        // Report info
        doc.setTextColor(0, 0, 0);
        doc.setFontSize(10);
        const startDate = document.getElementById('startDate').value;
        const endDate = document.getElementById('endDate').value;
        doc.text(`Period: ${startDate} to ${endDate}`, 20, 55);
        doc.text(`Generated: ${new Date().toLocaleString()}`, 20, 63);
        doc.text(`Total Appointments: ${currentReportData.length}`, 20, 71);
        doc.text(`Total Revenue: ₱${(currentReportData.length * 800).toLocaleString()}`, 20, 79);
        
        // Table data
        const tableData = currentReportData.map(row => [
            row.date,
            row.patient_name,
            row.doctor_name,
            row.status,
            row.reason
        ]);
        
        doc.autoTable({
            startY: 90,
            head: [['Date', 'Patient', 'Doctor', 'Status', 'Reason']],
            body: tableData,
            theme: 'striped',
            headStyles: { fillColor: [40, 123, 158], textColor: [255, 255, 255] },
            alternateRowStyles: { fillColor: [248, 250, 252] }
        });
        
        doc.save(`appointments_report_${new Date().toISOString().split('T')[0]}.pdf`);
    }

    function exportToExcel() {
        if (!currentReportData || currentReportData.length === 0) {
            alert('No data to export. Please generate a report first.');
            return;
        }
        
        // Prepare worksheet data
        const wsData = [
            ['Wellmeadows Hospital - Appointment Report'],
            [`Period: ${document.getElementById('startDate').value} to ${document.getElementById('endDate').value}`],
            [`Generated: ${new Date().toLocaleString()}`],
            [],
            ['Date', 'Patient Name', 'Doctor Name', 'Status', 'Reason']
        ];
        
        currentReportData.forEach(row => {
            wsData.push([
                row.date,
                row.patient_name,
                row.doctor_name,
                row.status,
                row.reason
            ]);
        });
        
        // Add summary row
        wsData.push([]);
        wsData.push(['Summary', '', '', '', '']);
        wsData.push(['Total Appointments', currentReportData.length, '', '', '']);
        wsData.push(['Total Revenue', `₱${(currentReportData.length * 800).toLocaleString()}`, '', '', '']);
        
        const ws = XLSX.utils.aoa_to_sheet(wsData);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, 'Appointment Report');
        XLSX.writeFile(wb, `appointments_report_${new Date().toISOString().split('T')[0]}.xlsx`);
    }

    // Sidebar toggle
    const sidebar = document.getElementById('sidebar');
    const mainContent = document.getElementById('mainContent');
    document.getElementById('toggleSidebar').addEventListener('click', () => {
        sidebar.classList.toggle('closed');
        mainContent.classList.toggle('expanded');
    });

    // Logout
    document.getElementById('logoutBtn').addEventListener('click', async () => {
        await supabaseClient.auth.signOut();
        window.location.href = 'login.html';
    });

    // Auth check
    async function checkAuth() {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (!session) {
            window.location.href = 'login.html';
            return;
        }
        const { data: staff } = await supabaseClient
            .from('staff')
            .select('first_name, last_name')
            .eq('email', session.user.email)
            .single();
        if (staff) {
            document.getElementById('adminName').textContent = `${staff.first_name} ${staff.last_name}`;
        }
    }

    // Initialize
    checkAuth();
    setDefaultDates();
    loadReport();
</script>
</body>
</html>
