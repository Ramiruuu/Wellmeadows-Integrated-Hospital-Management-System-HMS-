<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports - Wellmeadows Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- PDF Generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
    <!-- Excel Export -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <!-- Charts -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #f1f5f9; }
        .app-container { display: flex; min-height: 100vh; }
        .sidebar {
            width: 280px;
            background: linear-gradient(180deg, #0f2b3d 0%, #0a1e2c 100%);
            color: #e2e8f0;
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100vh;
            overflow-y: auto;
        }
        .sidebar-header { padding: 28px 24px; border-bottom: 1px solid rgba(255,255,255,0.08); }
        .logo-area { display: flex; align-items: center; gap: 12px; }
        .logo-icon { font-size: 2rem; color: #5fc3ff; }
        .logo-text { font-size: 1.3rem; font-weight: 700; color: white; }
        .logo-sub { font-size: 0.7rem; color: #94a3b8; margin-top: 8px; padding-left: 52px; }
        .sidebar-nav { flex: 1; padding: 24px 16px; display: flex; flex-direction: column; gap: 8px; }
        .nav-item { display: flex; align-items: center; gap: 14px; padding: 12px 20px; border-radius: 12px; color: #cbd5e6; text-decoration: none; font-weight: 500; font-size: 0.9rem; transition: all 0.2s; }
        .nav-item i { width: 22px; }
        .nav-item:hover { background: rgba(77, 184, 255, 0.12); color: white; }
        .nav-item.active { background: #287b9e; color: white; }
        .sidebar-footer { padding: 20px 24px; border-top: 1px solid rgba(255,255,255,0.08); }
        .status-indicator { display: flex; align-items: center; gap: 10px; font-size: 0.75rem; color: #86efac; }
        .user-info { margin-top: 16px; padding-top: 16px; border-top: 1px solid rgba(255,255,255,0.08); display: flex; flex-direction: column; gap: 10px; }
        .logout-btn { background: rgba(220,38,38,0.2); border: none; color: #fca5a5; padding: 10px; border-radius: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 500; }
        .logout-btn:hover { background: rgba(220,38,38,0.4); color: white; }
        .main-content { flex: 1; margin-left: 280px; padding: 28px 32px; }
        .page-header { margin-bottom: 28px; }
        .page-header h1 { font-size: 1.8rem; color: #0f2b3d; margin-bottom: 8px; }
        .card { background: white; border-radius: 20px; padding: 24px; margin-bottom: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); border: 1px solid #e2e8f0; }
        .card h2 { font-size: 1.1rem; margin-bottom: 16px; color: #0f2b3d; }
        .button-group { display: flex; gap: 16px; flex-wrap: wrap; }
        .btn {
            padding: 12px 24px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            border: none;
            transition: all 0.2s;
            font-size: 0.85rem;
        }
        .btn-primary { background: #287b9e; color: white; }
        .btn-primary:hover { background: #1a5f7a; transform: translateY(-1px); }
        .btn-success { background: #059669; color: white; }
        .btn-success:hover { background: #047857; }
        .btn-secondary { background: #f1f5f9; color: #475569; border: 1px solid #e2e8f0; }
        .btn-secondary:hover { background: #e2e8f0; }
        .date-range { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; margin-bottom: 20px; }
        .date-range input { padding: 10px 14px; border: 1.5px solid #e2e8f0; border-radius: 12px; font-size: 0.85rem; font-family: 'Inter', sans-serif; }
        .stats-summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 24px; }
        .summary-item { background: #f8fafc; padding: 16px; border-radius: 16px; text-align: center; }
        .summary-item .value { font-size: 1.8rem; font-weight: 700; color: #287b9e; }
        .summary-item .label { font-size: 0.7rem; color: #64748b; margin-top: 4px; letter-spacing: 0.5px; }
        .table-wrapper { overflow-x: auto; margin-top: 16px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #eef2f8; font-size: 0.85rem; }
        th { background: #f8fafc; font-weight: 600; color: #1e293b; }
        .empty-state { text-align: center; padding: 40px; color: #94a3b8; font-style: italic; }
        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: capitalize;
        }
        .status-scheduled { background: #e0f2fe; color: #0284c7; }
        .status-completed { background: #dcfce7; color: #15803d; }
        .status-cancelled { background: #fee2e2; color: #b91c1c; }
        .status-pending { background: #fef3c7; color: #b45309; }
        canvas { max-height: 300px; margin: 20px 0; }
        @media (max-width: 1000px) { .sidebar { width: 80px; } .sidebar .logo-text, .sidebar .logo-sub, .sidebar .nav-item span, .user-info span, .status-indicator span { display: none; } .sidebar .nav-item { justify-content: center; padding: 12px 0; } .main-content { margin-left: 80px; } }
    </style>
</head>
<body>
<div class="app-container">
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="logo-area"><i class="fas fa-hospital-user logo-icon"></i><div class="logo-text">Wellmeadows</div></div>
            <p class="logo-sub">Admin Portal</p>
        </div>
        <nav class="sidebar-nav">
            <a href="index.html" class="nav-item"><i class="fas fa-chalkboard-user"></i><span>Dashboard</span></a>
            <a href="appointments.html" class="nav-item"><i class="fas fa-calendar-check"></i><span>Appointments</span></a>
            <a href="calendar.html" class="nav-item"><i class="fas fa-calendar-alt"></i><span>Calendar</span></a>
            <a href="patients.html" class="nav-item"><i class="fas fa-users"></i><span>Patients</span></a>
            <a href="staff-schedule.html" class="nav-item"><i class="fas fa-user-md"></i><span>Staff Schedule</span></a>
            <a href="reports.html" class="nav-item active"><i class="fas fa-chart-line"></i><span>Reports</span></a>
        </nav>
        <div class="sidebar-footer">
            <div class="status-indicator"><i class="fas fa-circle"></i><span>System Online</span></div>
            <div class="user-info"><span id="adminName">Admin</span><button class="logout-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i><span>Logout</span></button></div>
        </div>
    </aside>
    <main class="main-content">
        <div class="page-header"><h1>Reports & Analytics</h1><p>Generate and export appointment insights</p></div>
        
        <div class="card">
            <h2>Date Range</h2>
            <div class="date-range">
                <input type="date" id="startDate">
                <input type="date" id="endDate">
                <button class="btn btn-secondary" onclick="loadReportData()"><i class="fas fa-search"></i> Apply Filter</button>
                <button class="btn btn-secondary" onclick="resetToCurrentMonth()"><i class="fas fa-calendar-week"></i> This Month</button>
            </div>
            <div class="stats-summary">
                <div class="summary-item"><div class="value" id="totalAppointments">0</div><div class="label">Total Appointments</div></div>
                <div class="summary-item"><div class="value" id="totalPatients">0</div><div class="label">Unique Patients</div></div>
                <div class="summary-item"><div class="value" id="totalRevenue">₱0</div><div class="label">Estimated Revenue</div></div>
            </div>
            <canvas id="reportChart" height="200"></canvas>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr><th>Date</th><th>Patient</th><th>Doctor</th><th>Status</th></tr>
                    </thead>
                    <tbody id="reportTable"></tbody>
                </table>
            </div>
            <div class="button-group" style="margin-top: 20px;">
                <button class="btn btn-primary" onclick="exportToPDF()"><i class="fas fa-file-pdf"></i> Export to PDF</button>
                <button class="btn btn-success" onclick="exportToExcel()"><i class="fas fa-file-excel"></i> Export to Excel</button>
            </div>
        </div>
    </main>
</div>

<script>
    // ==================== SUPABASE CONFIGURATION ====================
    const SUPABASE_URL = 'https://cqetejeaeasqkafdgjri.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_75JVFc0QWySSyAPQVO-C1g_Udqt9tgQ';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    
    let currentData = [];
    let reportChartInstance = null;

    // ==================== INITIALIZATION ====================
    async function init() {
        await checkAuth();
        setDefaultDates();
        await loadReportData();
    }

    function setDefaultDates() {
        const today = new Date();
        const firstDay = new Date(today.getFullYear(), today.getMonth(), 1);
        const endDate = today.toISOString().split('T')[0];
        const startDate = firstDay.toISOString().split('T')[0];
        
        if (!document.getElementById('startDate').value) {
            document.getElementById('startDate').value = startDate;
        }
        if (!document.getElementById('endDate').value) {
            document.getElementById('endDate').value = endDate;
        }
    }

    function resetToCurrentMonth() {
        const today = new Date();
        const firstDay = new Date(today.getFullYear(), today.getMonth(), 1);
        document.getElementById('startDate').value = firstDay.toISOString().split('T')[0];
        document.getElementById('endDate').value = today.toISOString().split('T')[0];
        loadReportData();
    }

    // ==================== LOAD REPORT DATA ====================
    async function loadReportData() {
        try {
            let start = document.getElementById('startDate').value;
            let end = document.getElementById('endDate').value;
            
            if (!start) {
                const d = new Date();
                d.setDate(1);
                start = d.toISOString().split('T')[0];
                document.getElementById('startDate').value = start;
            }
            if (!end) {
                const d = new Date();
                end = d.toISOString().split('T')[0];
                document.getElementById('endDate').value = end;
            }
            
            // Query appointments with nested patient and doctor data
            const { data, error } = await supabase
                .from('appointment')
                .select(`
                    *,
                    patient:patient(*),
                    doctor:staff(*)
                `)
                .gte('appointment_date', start)
                .lte('appointment_date', end)
                .order('appointment_date', { ascending: true });
            
            if (error) {
                console.error('Supabase error:', error);
                currentData = [];
            } else {
                currentData = data || [];
            }
            
            // Update summary cards
            document.getElementById('totalAppointments').textContent = currentData.length;
            const uniquePatients = new Set(currentData.map(a => a.patient_id).filter(id => id)).size;
            document.getElementById('totalPatients').textContent = uniquePatients;
            
            // Calculate revenue (example: ₱800 per completed appointment, can be customized)
            const estimatedRevenue = currentData.reduce((sum, apt) => {
                // Count only completed or scheduled as revenue baseline
                if (apt.status === 'completed' || apt.status === 'scheduled') {
                    return sum + 800;
                }
                return sum;
            }, 0);
            document.getElementById('totalRevenue').textContent = `₱${estimatedRevenue.toLocaleString()}`;
            
            // Render table
            renderTable(currentData);
            
            // Render chart
            renderChart(currentData);
            
        } catch (err) {
            console.error('Failed to load report data:', err);
            currentData = [];
            document.getElementById('totalAppointments').textContent = '0';
            document.getElementById('totalPatients').textContent = '0';
            document.getElementById('totalRevenue').textContent = '₱0';
            renderTable([]);
        }
    }

    function renderTable(data) {
        const tbody = document.getElementById('reportTable');
        if (!data || data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="4" class="empty-state">No appointments found for selected period</td></tr>';
            return;
        }
        
        tbody.innerHTML = data.map(apt => {
            const patientName = apt.patient 
                ? `${apt.patient.first_name || ''} ${apt.patient.last_name || ''}`.trim() || 'Unknown'
                : 'N/A';
            const doctorName = apt.doctor 
                ? `Dr. ${apt.doctor.first_name || ''} ${apt.doctor.last_name || ''}`.trim()
                : 'Unassigned';
            const status = apt.status || 'scheduled';
            const statusClass = `status-${status.toLowerCase()}`;
            
            return `
                <tr>
                    <td>${apt.appointment_date || '—'}</td>
                    <td><strong>${escapeHtml(patientName)}</strong></td>
                    <td>${escapeHtml(doctorName)}</td>
                    <td><span class="status-badge ${statusClass}">${escapeHtml(status)}</span></td>
                </tr>
            `;
        }).join('');
    }

    function renderChart(data) {
        const canvas = document.getElementById('reportChart');
        if (!canvas) return;
        
        // Aggregate appointments per day
        const dailyMap = new Map();
        if (data && data.length) {
            data.forEach(apt => {
                const date = apt.appointment_date;
                if (date) {
                    dailyMap.set(date, (dailyMap.get(date) || 0) + 1);
                }
            });
        }
        
        const sortedDates = Array.from(dailyMap.keys()).sort();
        const counts = sortedDates.map(date => dailyMap.get(date));
        
        // Destroy existing chart
        if (reportChartInstance) {
            reportChartInstance.destroy();
        }
        
        const ctx = canvas.getContext('2d');
        reportChartInstance = new Chart(ctx, {
            type: 'line',
            data: {
                labels: sortedDates,
                datasets: [{
                    label: 'Number of Appointments',
                    data: counts,
                    borderColor: '#287b9e',
                    backgroundColor: 'rgba(40, 123, 158, 0.1)',
                    borderWidth: 3,
                    pointBackgroundColor: '#287b9e',
                    pointBorderColor: '#fff',
                    pointRadius: 4,
                    pointHoverRadius: 6,
                    fill: true,
                    tension: 0.3
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: true,
                plugins: {
                    legend: { position: 'top', labels: { font: { family: 'Inter' } } },
                    tooltip: { backgroundColor: '#0f2b3d', titleFont: { family: 'Inter' }, bodyFont: { family: 'Inter' } }
                },
                scales: {
                    y: { beginAtZero: true, grid: { color: '#e2e8f0' }, title: { display: true, text: 'Appointments', font: { family: 'Inter' } } },
                    x: { ticks: { maxRotation: 45, autoSkip: true }, title: { display: true, text: 'Date', font: { family: 'Inter' } } }
                }
            }
        });
    }

    // ==================== EXPORT FUNCTIONS ====================
    function exportToPDF() {
        try {
            const { jsPDF } = window.jspdf;
            if (!jsPDF) {
                console.error('jsPDF not loaded');
                alert('PDF library not ready. Please refresh and try again.');
                return;
            }
            
            const doc = new jsPDF('landscape', 'mm', 'a4');
            
            // Header
            doc.setFillColor(15, 43, 61);
            doc.rect(0, 0, 297, 40, 'F');
            doc.setTextColor(255, 255, 255);
            doc.setFontSize(22);
            doc.setFont('helvetica', 'bold');
            doc.text('Wellmeadows Hospital', 20, 20);
            doc.setFontSize(12);
            doc.setFont('helvetica', 'normal');
            doc.text('Appointment Report', 20, 32);
            
            // Report Info
            doc.setTextColor(40, 40, 40);
            doc.setFontSize(10);
            const startDate = document.getElementById('startDate').value || 'N/A';
            const endDate = document.getElementById('endDate').value || 'N/A';
            doc.text(`Period: ${startDate} to ${endDate}`, 20, 52);
            doc.text(`Total Appointments: ${currentData.length}`, 20, 60);
            const revenueSpan = document.getElementById('totalRevenue').innerText;
            doc.text(`Estimated Revenue: ${revenueSpan}`, 20, 68);
            doc.text(`Generated: ${new Date().toLocaleString()}`, 20, 76);
            
            // Table Data
            const tableData = currentData.map(apt => [
                apt.appointment_date || '—',
                apt.patient ? `${apt.patient.first_name || ''} ${apt.patient.last_name || ''}`.trim() || 'N/A' : 'N/A',
                apt.doctor ? `Dr. ${apt.doctor.first_name || ''} ${apt.doctor.last_name || ''}`.trim() : 'Unassigned',
                apt.status || 'Scheduled'
            ]);
            
            doc.autoTable({
                startY: 85,
                head: [['Date', 'Patient Name', 'Doctor', 'Status']],
                body: tableData,
                theme: 'striped',
                headStyles: { fillColor: [40, 123, 158], textColor: 255, fontSize: 10, halign: 'center' },
                bodyStyles: { fontSize: 9, cellPadding: 3 },
                columnStyles: { 0: { cellWidth: 30 }, 1: { cellWidth: 50 }, 2: { cellWidth: 50 }, 3: { cellWidth: 30 } },
                margin: { left: 20, right: 20 }
            });
            
            doc.save(`Wellmeadows_Report_${new Date().toISOString().split('T')[0]}.pdf`);
        } catch (err) {
            console.error('PDF Export Error:', err);
            alert('Failed to generate PDF. Please ensure libraries loaded properly.');
        }
    }
    
    function exportToExcel() {
        try {
            if (typeof XLSX === 'undefined') {
                alert('Excel export library not ready. Please refresh.');
                return;
            }
            
            const startDate = document.getElementById('startDate').value || 'N/A';
            const endDate = document.getElementById('endDate').value || 'N/A';
            
            // Prepare worksheet data with headers
            const wsData = [
                ['Wellmeadows Hospital - Appointment Report'],
                [`Report Period: ${startDate} to ${endDate}`],
                [`Generated: ${new Date().toLocaleString()}`],
                [`Total Appointments: ${currentData.length}`],
                [],
                ['Date', 'Patient Name', 'Doctor', 'Status', 'Reason / Notes']
            ];
            
            currentData.forEach(apt => {
                const patientFull = apt.patient 
                    ? `${apt.patient.first_name || ''} ${apt.patient.last_name || ''}`.trim() || 'N/A'
                    : 'N/A';
                const doctorFull = apt.doctor 
                    ? `Dr. ${apt.doctor.first_name || ''} ${apt.doctor.last_name || ''}`.trim()
                    : 'Unassigned';
                wsData.push([
                    apt.appointment_date || '—',
                    patientFull,
                    doctorFull,
                    apt.status || 'Scheduled',
                    apt.reason || '—'
                ]);
            });
            
            // Add summary row
            wsData.push([], ['Summary Statistics', '', '', '', '']);
            wsData.push(['Total Appointments', currentData.length, '', '', '']);
            wsData.push(['Unique Patients', new Set(currentData.map(a => a.patient_id)).size, '', '', '']);
            
            const ws = XLSX.utils.aoa_to_sheet(wsData);
            // Adjust column widths
            ws['!cols'] = [{wch:14},{wch:28},{wch:28},{wch:14},{wch:30}];
            
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, 'Appointment_Report');
            XLSX.writeFile(wb, `Wellmeadows_Appointments_${new Date().toISOString().split('T')[0]}.xlsx`);
        } catch (err) {
            console.error('Excel Export Error:', err);
            alert('Failed to export Excel. Please refresh and try again.');
        }
    }
    
    // ==================== AUTH & UTILITIES ====================
    async function checkAuth() {
        try {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) {
                window.location.href = 'login.html';
                return;
            }
            // Display user email or name
            if (session.user && document.getElementById('adminName')) {
                const userEmail = session.user.email;
                document.getElementById('adminName').textContent = userEmail ? userEmail.split('@')[0] : 'Admin';
            }
        } catch (err) {
            console.error('Auth check error:', err);
            window.location.href = 'login.html';
        }
    }
    
    async function logout() {
        await supabase.auth.signOut();
        window.location.href = 'login.html';
    }
    
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        }).replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g, function(c) {
            return c;
        });
    }
    
    // Make functions globally accessible for inline handlers
    window.loadReportData = loadReportData;
    window.exportToPDF = exportToPDF;
    window.exportToExcel = exportToExcel;
    window.logout = logout;
    window.resetToCurrentMonth = resetToCurrentMonth;
    
    // Start the application
    init();
</script>
</body>
</html>
