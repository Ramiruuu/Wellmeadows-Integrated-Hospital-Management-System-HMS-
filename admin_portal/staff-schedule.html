<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Schedule - Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #f1f5f9; }
        .app-container { display: flex; min-height: 100vh; }
        .sidebar {
            width: 280px;
            background: linear-gradient(180deg, #0f2b3d 0%, #0a1e2c 100%);
            color: #e2e8f0;
            position: fixed;
            height: 100vh;
            overflow-y: auto;
        }
        .sidebar-header { padding: 28px 24px; border-bottom: 1px solid rgba(255,255,255,0.08); }
        .logo-area { display: flex; align-items: center; gap: 12px; }
        .logo-icon { font-size: 2rem; color: #5fc3ff; }
        .logo-text { font-size: 1.3rem; font-weight: 700; color: white; }
        .logo-sub { font-size: 0.7rem; color: #94a3b8; margin-top: 8px; padding-left: 52px; }
        .sidebar-nav { flex: 1; padding: 24px 16px; display: flex; flex-direction: column; gap: 8px; }
        .nav-item { display: flex; align-items: center; gap: 14px; padding: 12px 20px; border-radius: 12px; color: #cbd5e6; text-decoration: none; font-weight: 500; transition: all 0.2s; }
        .nav-item i { width: 22px; }
        .nav-item:hover { background: rgba(77, 184, 255, 0.12); color: white; }
        .nav-item.active { background: #287b9e; color: white; }
        .sidebar-footer { padding: 20px 24px; border-top: 1px solid rgba(255,255,255,0.08); }
        .user-info { margin-top: 16px; padding-top: 16px; border-top: 1px solid rgba(255,255,255,0.08); display: flex; flex-direction: column; gap: 10px; }
        .logout-btn { background: rgba(220,38,38,0.2); border: none; color: #fca5a5; padding: 10px; border-radius: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .main-content { flex: 1; margin-left: 280px; padding: 28px 32px; }
        .page-header { margin-bottom: 28px; }
        .page-header h1 { font-size: 1.8rem; color: #0f2b3d; margin-bottom: 8px; }
        .card { background: white; border-radius: 20px; padding: 24px; margin-bottom: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); border: 1px solid #e2e8f0; }
        .card h2 { font-size: 1.1rem; margin-bottom: 16px; color: #0f2b3d; }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 0.75rem; font-weight: 600; color: #475569; margin-bottom: 6px; text-transform: uppercase; }
        select, input { width: 100%; padding: 12px; border: 1.5px solid #e2e8f0; border-radius: 12px; font-size: 0.85rem; }
        .btn-primary { background: #287b9e; color: white; border: none; padding: 12px 24px; border-radius: 40px; font-weight: 600; cursor: pointer; }
        .schedule-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; margin-top: 20px; }
        .schedule-day { background: #f8fafc; border-radius: 12px; padding: 12px; text-align: center; border: 1px solid #e2e8f0; }
        .schedule-day .day { font-weight: 700; color: #0f2b3d; margin-bottom: 8px; }
        .schedule-shift { font-size: 0.75rem; color: #287b9e; font-weight: 600; }
        .avail { background: #dcfce7; border-color: #15803d; }
        .unavail { background: #fee2e2; border-color: #b91c1c; }
        @media (max-width: 1000px) { .sidebar { width: 80px; } .sidebar .logo-text, .sidebar .logo-sub, .sidebar .nav-item span, .user-info span { display: none; } .sidebar .nav-item { justify-content: center; padding: 12px 0; } .main-content { margin-left: 80px; } }
    </style>
</head>
<body>
<div class="app-container">
    <aside class="sidebar">
        <div class="sidebar-header"><div class="logo-area"><i class="fas fa-hospital-user logo-icon"></i><div class="logo-text">Wellmeadows</div></div><p class="logo-sub">Admin Portal</p></div>
        <nav class="sidebar-nav">
            <a href="index.html" class="nav-item"><i class="fas fa-chalkboard-user"></i><span>Dashboard</span></a>
            <a href="appointments.html" class="nav-item"><i class="fas fa-calendar-check"></i><span>Appointments</span></a>
            <a href="calendar.html" class="nav-item"><i class="fas fa-calendar-alt"></i><span>Calendar</span></a>
            <a href="patients.html" class="nav-item"><i class="fas fa-users"></i><span>Patients</span></a>
            <a href="staff-schedule.html" class="nav-item active"><i class="fas fa-user-md"></i><span>Staff Schedule</span></a>
            <a href="reports.html" class="nav-item"><i class="fas fa-chart-line"></i><span>Reports</span></a>
        </nav>
        <div class="sidebar-footer"><div class="user-info"><span id="adminName">Admin</span><button class="logout-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i><span>Logout</span></button></div></div>
    </aside>
    <main class="main-content">
        <div class="page-header"><h1>Doctor Schedule Management</h1><p>Set doctor availability for appointments</p></div>
        
        <div class="card">
            <h2>Set Doctor Availability</h2>
            <div class="form-group"><label>Select Doctor</label><select id="doctorSelect"></select></div>
            <div class="form-group"><label>Select Date</label><input type="date" id="scheduleDate"></div>
            <div class="form-group"><label>Availability Status</label><select id="availabilityStatus"><option value="available">Available</option><option value="unavailable">Unavailable (Leave/Busy)</option></select></div>
            <button class="btn-primary" onclick="setAvailability()">Save Schedule</button>
        </div>
        
        <div class="card">
            <h2>Weekly Schedule Preview</h2>
            <div id="weeklySchedule" class="schedule-grid"></div>
        </div>
    </main>
</div>
<script src="../shared/supabase-config.js"></script>
<script>
    const supabase = supabaseClient;
    let doctors = [];
    
    async function loadDoctors() {
        const { data } = await supabase.from('staff').select('*').in('position', ['Doctor', 'Senior Doctor', 'Consultant']);
        doctors = data || [];
        const select = document.getElementById('doctorSelect');
        select.innerHTML = '<option value="">Select Doctor</option>' + doctors.map(d => `<option value="${d.staff_id}">Dr. ${d.first_name} ${d.last_name}</option>`).join('');
        if (doctors.length) loadWeeklySchedule(doctors[0].staff_id);
    }
    
    async function loadWeeklySchedule(doctorId) {
        const today = new Date();
        const weekDays = [];
        for (let i = 0; i < 7; i++) { const d = new Date(today); d.setDate(today.getDate() + i); weekDays.push(d.toISOString().split('T')[0]); }
        
        const { data: schedules } = await supabase.from('staff_schedule').select('*').eq('staff_id', doctorId).in('shift_date', weekDays);
        const scheduleMap = {};
        schedules?.forEach(s => { scheduleMap[s.shift_date] = s.shift_type; });
        
        const container = document.getElementById('weeklySchedule');
        const doctor = doctors.find(d => d.staff_id === doctorId);
        container.innerHTML = weekDays.map(date => {
            const dayName = new Date(date).toLocaleDateString('en-US', { weekday: 'short' });
            const status = scheduleMap[date];
            const isAvailable = status === 'available';
            return `<div class="schedule-day ${isAvailable ? 'avail' : status === 'unavailable' ? 'unavail' : ''}">
                        <div class="day">${dayName}<br><small>${date}</small></div>
                        <div class="schedule-shift">${status === 'available' ? '✅ Available' : status === 'unavailable' ? '❌ Unavailable' : '📅 Not Set'}</div>
                    </div>`;
        }).join('');
    }
    
    async function setAvailability() {
        const doctorId = document.getElementById('doctorSelect').value;
        const date = document.getElementById('scheduleDate').value;
        const status = document.getElementById('availabilityStatus').value;
        if (!doctorId || !date) { alert('Please select doctor and date'); return; }
        
        const { error } = await supabase.from('staff_schedule').upsert({
            staff_id: parseInt(doctorId),
            shift_date: date,
            shift_type: status,
            created_at: new Date().toISOString()
        });
        if (error) { alert('Error: ' + error.message); return; }
        alert('Schedule saved!');
        loadWeeklySchedule(parseInt(doctorId));
        document.getElementById('scheduleDate').value = '';
    }
    
    document.getElementById('doctorSelect').addEventListener('change', (e) => { if (e.target.value) loadWeeklySchedule(parseInt(e.target.value)); });
    async function logout() { await supabase.auth.signOut(); window.location.href = 'login.html'; }
    async function checkAuth() { const { data: { session } } = await supabase.auth.getSession(); if (!session) window.location.href = 'login.html'; }
    checkAuth(); loadDoctors();
</script>
</body>
</html>
