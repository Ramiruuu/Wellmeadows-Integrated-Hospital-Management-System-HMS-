<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Schedule - Wellmeadows Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: #f1f5f9;
        }

        /* Sidebar Styles */
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            height: 100%;
            width: 280px;
            background: linear-gradient(180deg, #0f2b3d 0%, #0a1e2c 100%);
            color: #e2e8f0;
            transition: all 0.3s;
            z-index: 100;
            overflow-y: auto;
        }
        .sidebar.closed {
            width: 80px;
        }
        .sidebar.closed .sidebar-nav span,
        .sidebar.closed .logo-text,
        .sidebar.closed .logo-sub,
        .sidebar.closed .user-details {
            display: none;
        }
        .sidebar.closed .sidebar-nav .nav-item {
            justify-content: center;
            padding: 12px;
        }
        .sidebar-header {
            padding: 24px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .logo-icon {
            font-size: 2rem;
            color: #4db8ff;
        }
        .logo-text {
            font-size: 1.3rem;
            font-weight: 700;
            color: white;
        }
        .logo-sub {
            font-size: 0.7rem;
            color: #94a3b8;
            margin-top: 6px;
            padding-left: 52px;
        }
        .toggle-btn {
            position: absolute;
            top: 20px;
            right: -12px;
            background: #287b9e;
            border: 2px solid #0f2b3d;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: white;
            z-index: 101;
        }
        .sidebar-nav {
            padding: 0 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 16px;
            border-radius: 12px;
            color: #cbd5e6;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.9rem;
            transition: all 0.2s;
        }
        .nav-item i {
            width: 24px;
        }
        .nav-item:hover {
            background: rgba(77, 184, 255, 0.12);
            color: white;
        }
        .nav-item.active {
            background: #287b9e;
            color: white;
        }
        .sidebar-footer {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }
        .user-avatar {
            width: 40px;
            height: 40px;
            background: #287b9e;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .user-name {
            font-weight: 600;
            font-size: 0.85rem;
            color: white;
        }
        .logout-btn {
            width: 100%;
            background: rgba(220, 38, 38, 0.2);
            border: none;
            color: #fca5a5;
            padding: 10px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .logout-btn:hover {
            background: rgba(220, 38, 38, 0.4);
            color: white;
        }

        /* Main Content */
        .main-content {
            margin-left: 280px;
            padding: 24px 32px;
            transition: all 0.3s;
            min-height: 100vh;
        }
        .main-content.expanded {
            margin-left: 80px;
        }
        .page-header {
            margin-bottom: 32px;
        }
        .page-header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            color: #0f2b3d;
            margin-bottom: 8px;
        }
        .page-header p {
            color: #64748b;
            font-size: 0.9rem;
        }

        /* Cards */
        .card {
            background: white;
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 24px;
            border: 1px solid #e2e8f0;
        }
        .card-title {
            font-size: 1rem;
            font-weight: 600;
            color: #0f2b3d;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid #eef2f8;
        }

        /* Form */
        .form-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 20px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .form-group label {
            font-size: 0.75rem;
            font-weight: 600;
            color: #475569;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        select, input {
            width: 100%;
            padding: 12px;
            border: 1.5px solid #e2e8f0;
            border-radius: 12px;
            font-size: 0.9rem;
            font-family: 'Inter', sans-serif;
            background: white;
        }
        select:focus, input:focus {
            outline: none;
            border-color: #287b9e;
        }
        .btn-primary {
            background: #287b9e;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.9rem;
        }
        .btn-primary:hover {
            background: #1a5f7a;
        }

        /* Schedule Grid */
        .current-doctor {
            background: #eef2ff;
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 0.9rem;
        }
        .current-doctor span {
            font-weight: 600;
            color: #0f2b3d;
        }
        .schedule-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 12px;
            margin-top: 16px;
        }
        .schedule-card {
            background: #f8fafc;
            border-radius: 16px;
            padding: 16px;
            text-align: center;
            border: 1px solid #e2e8f0;
            transition: all 0.2s;
        }
        .schedule-card.available {
            background: #dcfce7;
            border-color: #86efac;
        }
        .schedule-card.unavailable {
            background: #fee2e2;
            border-color: #fecaca;
        }
        .schedule-date {
            font-weight: 700;
            color: #0f2b3d;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }
        .schedule-day {
            font-size: 0.7rem;
            color: #64748b;
            margin-bottom: 12px;
        }
        .schedule-status {
            font-size: 0.75rem;
            font-weight: 600;
            padding: 6px 0;
            border-radius: 20px;
        }
        .status-available {
            color: #15803d;
        }
        .status-unavailable {
            color: #b91c1c;
        }
        .status-not-set {
            color: #64748b;
        }
        .empty-state {
            text-align: center;
            padding: 48px;
            color: #94a3b8;
            grid-column: span 7;
        }

        /* Responsive */
        @media (max-width: 1000px) {
            .schedule-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }
        @media (max-width: 768px) {
            .sidebar {
                width: 80px;
            }
            .sidebar .logo-text,
            .sidebar .logo-sub,
            .sidebar .user-details {
                display: none;
            }
            .sidebar .nav-item {
                justify-content: center;
                padding: 12px;
            }
            .sidebar .nav-item span {
                display: none;
            }
            .main-content {
                margin-left: 80px;
                padding: 20px;
            }
            .form-row {
                grid-template-columns: 1fr;
            }
            .schedule-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>

<aside class="sidebar" id="sidebar">
    <div class="toggle-btn" id="toggleSidebar">
        <i class="fas fa-chevron-left"></i>
    </div>
    <div class="sidebar-header">
        <div class="logo-area">
            <i class="fas fa-hospital-user logo-icon"></i>
            <div class="logo-text">Wellmeadows</div>
        </div>
        <div class="logo-sub">Admin Portal</div>
    </div>
    <nav class="sidebar-nav">
        <a href="index.html" class="nav-item"><i class="fas fa-chalkboard-user"></i><span>Dashboard</span></a>
        <a href="appointments.html" class="nav-item"><i class="fas fa-calendar-check"></i><span>Appointments</span></a>
        <a href="calendar.html" class="nav-item"><i class="fas fa-calendar-alt"></i><span>Calendar</span></a>
        <a href="patients.html" class="nav-item"><i class="fas fa-users"></i><span>Patients</span></a>
        <a href="staff-schedule.html" class="nav-item active"><i class="fas fa-user-md"></i><span>Staff Schedule</span></a>
        <a href="reports.html" class="nav-item"><i class="fas fa-chart-line"></i><span>Reports</span></a>
    </nav>
    <div class="sidebar-footer">
        <div class="user-info">
            <div class="user-avatar"><i class="fas fa-user-circle"></i></div>
            <div class="user-details">
                <div class="user-name" id="adminName">Admin</div>
            </div>
        </div>
        <button class="logout-btn" id="logoutBtn">Logout</button>
    </div>
</aside>

<main class="main-content" id="mainContent">
    <div class="page-header">
        <h1>Staff Schedule Management</h1>
        <p>Set doctor availability for appointments</p>
    </div>

    <!-- Set Availability Card -->
    <div class="card">
        <div class="card-title">Set Doctor Availability</div>
        <div class="form-row">
            <div class="form-group">
                <label>Select Doctor</label>
                <select id="doctorSelect">
                    <option value="">-- Select Doctor --</option>
                </select>
            </div>
            <div class="form-group">
                <label>Select Date</label>
                <input type="date" id="scheduleDate">
            </div>
            <div class="form-group">
                <label>Availability Status</label>
                <select id="availabilityStatus">
                    <option value="available">Available</option>
                    <option value="unavailable">Unavailable (Leave/Busy)</option>
                </select>
            </div>
        </div>
        <button class="btn-primary" id="saveScheduleBtn">Save Schedule</button>
    </div>

    <!-- Weekly Schedule Card -->
    <div class="card">
        <div class="card-title">Weekly Schedule</div>
        <div id="currentDoctorInfo" class="current-doctor">
            Select a doctor to view their schedule
        </div>
        <div id="weeklySchedule" class="schedule-grid"></div>
    </div>
</main>

<script>
    const SUPABASE_URL = 'https://cqetejeaeasqkafdgjri.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_75JVFc0QWySSyAPQVO-C1g_Udqt9tgQ';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let doctors = [];
    let currentDoctorId = null;

    // Format date to readable format
    function formatDate(dateStr) {
        const date = new Date(dateStr);
        return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    }

    // Get day name
    function getDayName(dateStr) {
        const date = new Date(dateStr);
        return date.toLocaleDateString('en-US', { weekday: 'short' });
    }

    // Load doctors into dropdown
    async function loadDoctors() {
        const { data } = await supabaseClient
            .from('staff')
            .select('*')
            .in('position', ['Doctor', 'Senior Doctor', 'Consultant', 'Surgeon']);
        
        doctors = data || [];
        const select = document.getElementById('doctorSelect');
        select.innerHTML = '<option value="">-- Select Doctor --</option>';
        
        doctors.forEach(doc => {
            select.innerHTML += `<option value="${doc.staff_id}">Dr. ${doc.first_name} ${doc.last_name} (${doc.position})</option>`;
        });
    }

    // Load weekly schedule for selected doctor
    async function loadWeeklySchedule(doctorId) {
        if (!doctorId) {
            document.getElementById('weeklySchedule').innerHTML = '<div class="empty-state">Select a doctor to view schedule</div>';
            document.getElementById('currentDoctorInfo').innerHTML = 'Select a doctor to view their schedule';
            return;
        }

        const doctor = doctors.find(d => d.staff_id === doctorId);
        document.getElementById('currentDoctorInfo').innerHTML = `Showing schedule for: <span>Dr. ${doctor.first_name} ${doctor.last_name}</span>`;

        // Get next 7 days
        const days = [];
        for (let i = 0; i < 7; i++) {
            const date = new Date();
            date.setDate(date.getDate() + i);
            days.push(date.toISOString().split('T')[0]);
        }

        // Fetch existing schedules
        const { data: schedules } = await supabaseClient
            .from('staff_schedule')
            .select('*')
            .eq('staff_id', doctorId)
            .in('shift_date', days);

        const scheduleMap = {};
        schedules?.forEach(s => {
            scheduleMap[s.shift_date] = s.shift_type;
        });

        // Render schedule grid
        const container = document.getElementById('weeklySchedule');
        container.innerHTML = days.map(date => {
            const status = scheduleMap[date];
            let statusClass = '';
            let statusText = '';
            let cardClass = '';

            if (status === 'available') {
                cardClass = 'available';
                statusText = 'Available';
                statusClass = 'status-available';
            } else if (status === 'unavailable') {
                cardClass = 'unavailable';
                statusText = 'Unavailable';
                statusClass = 'status-unavailable';
            } else {
                statusText = 'Not Set';
                statusClass = 'status-not-set';
            }

            return `
                <div class="schedule-card ${cardClass}">
                    <div class="schedule-date">${formatDate(date)}</div>
                    <div class="schedule-day">${getDayName(date)}</div>
                    <div class="schedule-status ${statusClass}">${statusText}</div>
                </div>
            `;
        }).join('');
    }

    // Save availability
    async function setAvailability() {
        const doctorId = document.getElementById('doctorSelect').value;
        const date = document.getElementById('scheduleDate').value;
        const status = document.getElementById('availabilityStatus').value;

        if (!doctorId) {
            alert('Please select a doctor');
            return;
        }
        if (!date) {
            alert('Please select a date');
            return;
        }

        // Check if schedule already exists for this doctor and date
        const { data: existing } = await supabaseClient
            .from('staff_schedule')
            .select('*')
            .eq('staff_id', parseInt(doctorId))
            .eq('shift_date', date)
            .single();

        let result;
        if (existing) {
            // Update existing
            result = await supabaseClient
                .from('staff_schedule')
                .update({ 
                    shift_type: status,
                    updated_at: new Date().toISOString()
                })
                .eq('schedule_id', existing.schedule_id);
        } else {
            // Insert new
            result = await supabaseClient
                .from('staff_schedule')
                .insert([{
                    staff_id: parseInt(doctorId),
                    shift_date: date,
                    shift_type: status,
                    created_at: new Date().toISOString(),
                    updated_at: new Date().toISOString()
                }]);
        }

        if (result.error) {
            alert('Error saving schedule: ' + result.error.message);
        } else {
            alert('Schedule saved successfully!');
            document.getElementById('scheduleDate').value = '';
            // Refresh the schedule display
            loadWeeklySchedule(parseInt(doctorId));
        }
    }

    // Event Listeners
    document.getElementById('doctorSelect').addEventListener('change', (e) => {
        const doctorId = e.target.value;
        currentDoctorId = doctorId;
        if (doctorId) {
            loadWeeklySchedule(parseInt(doctorId));
        } else {
            loadWeeklySchedule(null);
        }
    });

    document.getElementById('saveScheduleBtn').addEventListener('click', setAvailability);

    // Sidebar toggle
    const sidebar = document.getElementById('sidebar');
    const mainContent = document.getElementById('mainContent');
    document.getElementById('toggleSidebar').addEventListener('click', () => {
        sidebar.classList.toggle('closed');
        mainContent.classList.toggle('expanded');
    });

    // Logout
    document.getElementById('logoutBtn').addEventListener('click', async () => {
        await supabaseClient.auth.signOut();
        window.location.href = 'login.html';
    });

    // Auth check
    async function checkAuth() {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (!session) {
            window.location.href = 'login.html';
            return;
        }
        const { data: staff } = await supabaseClient
            .from('staff')
            .select('first_name, last_name')
            .eq('email', session.user.email)
            .single();
        if (staff) {
            document.getElementById('adminName').textContent = `${staff.first_name} ${staff.last_name}`;
        }
    }

    // Initialize
    checkAuth();
    loadDoctors();
</script>
</body>
</html>
