<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Appointments - Wellmeadows Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #f1f5f9; }

        /* Sidebar Styles */
        .sidebar {
            position: fixed; top: 0; left: 0; height: 100%; width: 280px;
            background: linear-gradient(180deg, #0f2b3d 0%, #0a1e2c 100%);
            color: #e2e8f0; transition: all 0.3s; z-index: 100; overflow-y: auto;
        }
        .sidebar.closed { width: 80px; }
        .sidebar.closed .sidebar-nav span, .sidebar.closed .logo-text, 
        .sidebar.closed .logo-sub, .sidebar.closed .user-details { display: none; }
        .sidebar.closed .sidebar-nav .nav-item { justify-content: center; padding: 12px; }
        
        .sidebar-header { padding: 24px; border-bottom: 1px solid rgba(255,255,255,0.08); }
        .logo-area { display: flex; align-items: center; gap: 12px; }
        .logo-icon { font-size: 2rem; color: #4db8ff; }
        .logo-text { font-size: 1.3rem; font-weight: 700; color: white; }
        .logo-sub { font-size: 0.7rem; color: #94a3b8; margin-top: 6px; padding-left: 52px; }
        
        .toggle-btn {
            position: absolute; top: 20px; right: -12px; background: #287b9e;
            border: 2px solid #0f2b3d; border-radius: 50%; width: 28px; height: 28px;
            display: flex; align-items: center; justify-content: center; cursor: pointer;
            color: white; z-index: 101;
        }
        
        .sidebar-nav { padding: 0 16px; display: flex; flex-direction: column; gap: 8px; }
        .nav-item {
            display: flex; align-items: center; gap: 14px; padding: 12px 16px;
            border-radius: 12px; color: #cbd5e6; text-decoration: none;
            font-weight: 500; font-size: 0.9rem; transition: all 0.2s;
        }
        .nav-item i { width: 24px; }
        .nav-item:hover { background: rgba(77,184,255,0.12); color: white; }
        .nav-item.active { background: #287b9e; color: white; }
        
        .sidebar-footer {
            position: absolute; bottom: 0; left: 0; right: 0; padding: 20px;
            border-top: 1px solid rgba(255,255,255,0.08);
        }
        .user-info { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
        .user-avatar { width: 40px; height: 40px; background: #287b9e; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .user-name { font-weight: 600; font-size: 0.85rem; color: white; }
        .user-role { font-size: 0.7rem; color: #94a3b8; }
        .logout-btn {
            width: 100%; background: rgba(220,38,38,0.2); border: none; color: #fca5a5;
            padding: 10px; border-radius: 10px; cursor: pointer; display: flex;
            align-items: center; justify-content: center; gap: 8px;
        }
        .logout-btn:hover { background: rgba(220,38,38,0.4); color: white; }

        /* Main Content */
        .main-content { margin-left: 280px; padding: 24px 32px; transition: all 0.3s; min-height: 100vh; }
        .main-content.expanded { margin-left: 80px; }
        
        .top-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; }
        .page-title h1 { font-size: 1.8rem; font-weight: 700; color: #0f2b3d; margin-bottom: 4px; }
        .page-title p { color: #64748b; font-size: 0.85rem; }

        /* Filters */
        .filters-card {
            background: white;
            border-radius: 20px;
            padding: 20px 24px;
            margin-bottom: 24px;
            border: 1px solid #e2e8f0;
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            align-items: center;
        }
        .filter-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .filter-group label {
            font-size: 0.75rem;
            font-weight: 600;
            color: #475569;
        }
        .filter-group input, .filter-group select {
            padding: 8px 12px;
            border: 1.5px solid #e2e8f0;
            border-radius: 10px;
            font-size: 0.85rem;
        }
        .search-btn {
            background: #287b9e;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 10px;
            cursor: pointer;
        }
        .reset-btn {
            background: #f1f5f9;
            color: #475569;
            border: 1px solid #e2e8f0;
            padding: 8px 20px;
            border-radius: 10px;
            cursor: pointer;
        }

        /* Card */
        .card {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid #e2e8f0;
        }
        .card-header {
            padding: 20px 24px;
            border-bottom: 1px solid #eef2f8;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .card-header h3 {
            font-size: 1rem;
            font-weight: 600;
            color: #0f2b3d;
        }
        .refresh-btn {
            background: none;
            border: none;
            color: #287b9e;
            cursor: pointer;
            font-size: 0.85rem;
        }
        .table-wrapper { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 14px 16px; text-align: left; border-bottom: 1px solid #eef2f8; font-size: 0.85rem; }
        th { background: #f8fafc; font-weight: 600; color: #0f2b3d; }
        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
        }
        .status-scheduled { background: #fef3c7; color: #d97706; }
        .status-confirmed { background: #dbeafe; color: #2563eb; }
        .status-completed { background: #dcfce7; color: #15803d; }
        .status-cancelled { background: #fee2e2; color: #b91c1c; }
        .empty-state { text-align: center; padding: 48px; color: #94a3b8; }
        .action-btn {
            background: #287b9e;
            color: white;
            border: none;
            padding: 4px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.7rem;
        }
        .action-btn:hover { background: #1a5f7a; }

        @media (max-width: 768px) {
            .sidebar { width: 80px; }
            .sidebar .logo-text, .sidebar .logo-sub, .sidebar .user-details { display: none; }
            .sidebar .nav-item { justify-content: center; padding: 12px; }
            .sidebar .nav-item span { display: none; }
            .main-content { margin-left: 80px; padding: 20px; }
            .filters-card { flex-direction: column; align-items: stretch; }
        }
    </style>
</head>
<body>

<aside class="sidebar" id="sidebar">
    <div class="toggle-btn" id="toggleSidebar"><i class="fas fa-chevron-left"></i></div>
    <div class="sidebar-header">
        <div class="logo-area"><i class="fas fa-hospital-user logo-icon"></i><div class="logo-text">Wellmeadows</div></div>
        <div class="logo-sub">Admin Portal</div>
    </div>
    <nav class="sidebar-nav">
        <a href="index.html" class="nav-item"><i class="fas fa-chalkboard-user"></i><span>Dashboard</span></a>
        <a href="appointments.html" class="nav-item active"><i class="fas fa-calendar-check"></i><span>Appointments</span></a>
        <a href="calendar.html" class="nav-item"><i class="fas fa-calendar-alt"></i><span>Calendar</span></a>
        <a href="patients.html" class="nav-item"><i class="fas fa-users"></i><span>Patients</span></a>
        <a href="staff-schedule.html" class="nav-item"><i class="fas fa-user-md"></i><span>Staff Schedule</span></a>
        <a href="reports.html" class="nav-item"><i class="fas fa-chart-line"></i><span>Reports</span></a>
    </nav>
    <div class="sidebar-footer">
        <div class="user-info"><div class="user-avatar"><i class="fas fa-user-circle"></i></div><div class="user-details"><div class="user-name" id="adminName">Admin</div><div class="user-role">Administrator</div></div></div>
        <button class="logout-btn" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</button>
    </div>
</aside>

<main class="main-content" id="mainContent">
    <div class="top-header">
        <div class="page-title">
            <h1>Appointments</h1>
            <p>Manage and track all patient appointments</p>
        </div>
    </div>

    <!-- Filters -->
    <div class="filters-card">
        <div class="filter-group">
            <label><i class="fas fa-calendar"></i> Date:</label>
            <input type="date" id="dateFilter">
        </div>
        <div class="filter-group">
            <label><i class="fas fa-tag"></i> Status:</label>
            <select id="statusFilter">
                <option value="">All</option>
                <option value="Scheduled">Scheduled</option>
                <option value="Confirmed">Confirmed</option>
                <option value="Completed">Completed</option>
                <option value="Cancelled">Cancelled</option>
            </select>
        </div>
        <div class="filter-group">
            <label><i class="fas fa-search"></i> Search:</label>
            <input type="text" id="searchFilter" placeholder="Patient or doctor...">
        </div>
        <button class="search-btn" onclick="applyFilters()"><i class="fas fa-filter"></i> Apply Filters</button>
        <button class="reset-btn" onclick="resetFilters()"><i class="fas fa-undo"></i> Reset</button>
    </div>

    <!-- Appointments Table -->
    <div class="card">
        <div class="card-header">
            <h3><i class="fas fa-list"></i> All Appointments</h3>
            <button class="refresh-btn" onclick="loadAppointments()"><i class="fas fa-sync-alt"></i> Refresh</button>
        </div>
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Date</th>
                        <th>Time</th>
                        <th>Patient</th>
                        <th>Doctor</th>
                        <th>Reason</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="appointmentsTable">
                    <tr><td colspan="8" class="empty-state">Loading appointments...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<script>
    const SUPABASE_URL = 'https://cqetejeaeasqkafdgjri.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_75JVFc0QWySSyAPQVO-C1g_Udqt9tgQ';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let allAppointments = [];
    let patients = [];
    let staff = [];

    async function loadData() {
        // Fetch all data
        const [aptRes, patRes, staffRes] = await Promise.all([
            supabaseClient.from('appointment').select('*').order('appointment_date', { ascending: false }),
            supabaseClient.from('patient').select('*'),
            supabaseClient.from('staff').select('*')
        ]);
        
        allAppointments = aptRes.data || [];
        patients = patRes.data || [];
        staff = staffRes.data || [];
        
        console.log(`Loaded ${allAppointments.length} appointments, ${patients.length} patients, ${staff.length} staff`);
        
        renderTable(allAppointments);
    }

    function renderTable(appointments) {
        const tbody = document.getElementById('appointmentsTable');
        
        if (!appointments || appointments.length === 0) {
            tbody.innerHTML = '<tr><td colspan="8" class="empty-state">No appointments found</td></tr>';
            return;
        }
        
        // Create lookup maps
        const patientMap = {};
        patients.forEach(p => { patientMap[p.patient_id] = `${p.first_name} ${p.last_name}`; });
        
        const staffMap = {};
        staff.forEach(s => { staffMap[s.staff_id] = `Dr. ${s.first_name} ${s.last_name}`; });
        
        tbody.innerHTML = appointments.map(apt => {
            let statusClass = '';
            switch(apt.status) {
                case 'Scheduled': statusClass = 'status-scheduled'; break;
                case 'Confirmed': statusClass = 'status-confirmed'; break;
                case 'Completed': statusClass = 'status-completed'; break;
                case 'Cancelled': statusClass = 'status-cancelled'; break;
                default: statusClass = 'status-scheduled';
            }
            return `
                <tr>
                    <td>${apt.appointment_id}</td>
                    <td>${apt.appointment_date}</td>
                    <td>${apt.appointment_time}</td>
                    <td><strong>${patientMap[apt.patient_id] || 'Unknown'}</strong></td>
                    <td>${staffMap[apt.staff_id] || 'Unknown'}</td>
                    <td>${apt.reason || '-'}</td>
                    <td><span class="status-badge ${statusClass}">${apt.status || 'Scheduled'}</span></td>
                    <td><button class="action-btn" onclick="updateStatus(${apt.appointment_id})">Update</button></td>
                </tr>
            `;
        }).join('');
    }

    function applyFilters() {
        const dateValue = document.getElementById('dateFilter').value;
        const statusValue = document.getElementById('statusFilter').value;
        const searchValue = document.getElementById('searchFilter').value.toLowerCase();
        
        let filtered = [...allAppointments];
        
        if (dateValue) {
            filtered = filtered.filter(apt => apt.appointment_date === dateValue);
        }
        if (statusValue) {
            filtered = filtered.filter(apt => apt.status === statusValue);
        }
        if (searchValue) {
            const patientMap = {};
            patients.forEach(p => { patientMap[p.patient_id] = `${p.first_name} ${p.last_name}`.toLowerCase(); });
            const staffMap = {};
            staff.forEach(s => { staffMap[s.staff_id] = `${s.first_name} ${s.last_name}`.toLowerCase(); });
            
            filtered = filtered.filter(apt => {
                const patientName = patientMap[apt.patient_id] || '';
                const doctorName = staffMap[apt.staff_id] || '';
                return patientName.includes(searchValue) || doctorName.includes(searchValue);
            });
        }
        
        renderTable(filtered);
    }

    function resetFilters() {
        document.getElementById('dateFilter').value = '';
        document.getElementById('statusFilter').value = '';
        document.getElementById('searchFilter').value = '';
        renderTable(allAppointments);
    }

    async function updateStatus(appointmentId) {
        const newStatus = prompt('Enter new status (Scheduled, Confirmed, Completed, Cancelled):');
        if (newStatus && ['Scheduled', 'Confirmed', 'Completed', 'Cancelled'].includes(newStatus)) {
            await supabaseClient
                .from('appointment')
                .update({ status: newStatus, updated_at: new Date().toISOString() })
                .eq('appointment_id', appointmentId);
            loadData();
        }
    }

    // Sidebar toggle
    const sidebar = document.getElementById('sidebar');
    const mainContent = document.getElementById('mainContent');
    document.getElementById('toggleSidebar').addEventListener('click', () => {
        sidebar.classList.toggle('closed');
        mainContent.classList.toggle('expanded');
    });

    // Logout
    document.getElementById('logoutBtn').addEventListener('click', async () => {
        await supabaseClient.auth.signOut();
        window.location.href = 'login.html';
    });

    // Auth check
    async function checkAuth() {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (!session) {
            window.location.href = 'login.html';
            return;
        }
        const { data: staffData } = await supabaseClient
            .from('staff')
            .select('first_name, last_name')
            .eq('email', session.user.email)
            .single();
        if (staffData) {
            document.getElementById('adminName').textContent = `${staffData.first_name} ${staffData.last_name}`;
        }
    }

    checkAuth();
    loadData();
</script>
</body>
</html>
