<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patients - Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #f1f5f9; }
        .app-container { display: flex; min-height: 100vh; }
        .sidebar { width: 280px; background: linear-gradient(180deg, #0f2b3d 0%, #0a1e2c 100%); color: #e2e8f0; position: fixed; height: 100vh; }
        .sidebar-header { padding: 28px 24px; border-bottom: 1px solid rgba(255,255,255,0.08); }
        .logo-area { display: flex; align-items: center; gap: 12px; }
        .logo-icon { font-size: 2rem; color: #5fc3ff; }
        .logo-text { font-size: 1.3rem; font-weight: 700; color: white; }
        .sidebar-nav { padding: 24px 16px; display: flex; flex-direction: column; gap: 8px; }
        .nav-item { display: flex; align-items: center; gap: 14px; padding: 12px 20px; border-radius: 12px; color: #cbd5e6; text-decoration: none; font-weight: 500; }
        .nav-item:hover { background: rgba(77, 184, 255, 0.12); color: white; }
        .nav-item.active { background: #287b9e; color: white; }
        .sidebar-footer { padding: 20px 24px; border-top: 1px solid rgba(255,255,255,0.08); }
        .user-info { margin-top: 16px; padding-top: 16px; display: flex; flex-direction: column; gap: 10px; }
        .logout-btn { background: rgba(220,38,38,0.2); border: none; color: #fca5a5; padding: 10px; border-radius: 10px; cursor: pointer; }
        .main-content { flex: 1; margin-left: 280px; padding: 28px 32px; }
        .page-header { margin-bottom: 24px; }
        .page-header h1 { font-size: 1.8rem; color: #0f2b3d; }
        .search-box { margin-bottom: 24px; }
        .search-box input { width: 300px; padding: 12px 16px; border: 1.5px solid #e2e8f0; border-radius: 40px; font-size: 0.85rem; }
        .card { background: white; border-radius: 20px; overflow: hidden; border: 1px solid #e2e8f0; }
        .table-wrapper { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 14px 16px; text-align: left; border-bottom: 1px solid #eef2f8; font-size: 0.85rem; }
        th { background: #f8fafc; font-weight: 600; color: #0f2b3d; }
        @media (max-width: 1000px) { .sidebar { width: 80px; } .sidebar .logo-text, .sidebar .nav-item span, .user-info span { display: none; } .sidebar .nav-item { justify-content: center; padding: 12px 0; } .main-content { margin-left: 80px; } }
    </style>
</head>
<body>
<div class="app-container">
    <aside class="sidebar">
        <div class="sidebar-header"><div class="logo-area"><i class="fas fa-hospital-user logo-icon"></i><div class="logo-text">Wellmeadows</div></div></div>
        <nav class="sidebar-nav">
            <a href="index.html" class="nav-item"><i class="fas fa-chalkboard-user"></i><span>Dashboard</span></a>
            <a href="appointments.html" class="nav-item"><i class="fas fa-calendar-check"></i><span>Appointments</span></a>
            <a href="calendar.html" class="nav-item"><i class="fas fa-calendar-alt"></i><span>Calendar</span></a>
            <a href="patients.html" class="nav-item active"><i class="fas fa-users"></i><span>Patients</span></a>
            <a href="staff-schedule.html" class="nav-item"><i class="fas fa-user-md"></i><span>Staff Schedule</span></a>
            <a href="reports.html" class="nav-item"><i class="fas fa-chart-line"></i><span>Reports</span></a>
        </nav>
        <div class="sidebar-footer"><div class="user-info"><span id="adminName">Admin</span><button class="logout-btn" onclick="logout()">Logout</button></div></div>
    </aside>
    <main class="main-content">
        <div class="page-header"><h1>Patient Records</h1></div>
        <div class="search-box"><input type="text" id="searchInput" placeholder="Search by name, email, or phone..."></div>
        <div class="card"><div class="table-wrapper"><table><thead><tr><th>ID</th><th>Full Name</th><th>Email</th><th>Phone</th><th>Registered</th><th>Appointments</th></tr></thead><tbody id="patientsTable"></tbody></table></div></div>
    </main>
</div>
<script src="../shared/supabase-config.js"></script>
<script>
    const supabase = supabaseClient;
    let allPatients = [];
    async function loadPatients() {
        const { data } = await supabase.from('patient').select('*').order('patient_id', { ascending: false });
        allPatients = data || [];
        for (let p of allPatients) { const { count } = await supabase.from('appointment').select('*', { count: 'exact', head: true }).eq('patient_id', p.patient_id); p.appointment_count = count || 0; }
        renderPatients(allPatients);
    }
    function renderPatients(patients) {
        const tbody = document.getElementById('patientsTable');
        if (patients.length === 0) { tbody.innerHTML = '<tr><td colspan="6" class="empty-state">No patients found</td></tr>'; return; }
        tbody.innerHTML = patients.map(p => `<tr><td>${p.patient_id}</td><td><strong>${p.first_name} ${p.last_name}</strong></td><td>${p.email || '-'}</td><td>${p.phone || '-'}</td><td>${p.date_registered || '-'}</td><td>${p.appointment_count}</td></tr>`).join('');
    }
    function searchPatients() {
        const term = document.getElementById('searchInput').value.toLowerCase();
        if (!term) renderPatients(allPatients);
        else renderPatients(allPatients.filter(p => `${p.first_name} ${p.last_name}`.toLowerCase().includes(term) || (p.email && p.email.toLowerCase().includes(term)) || (p.phone && p.phone.includes(term))));
    }
    async function logout() { await supabase.auth.signOut(); window.location.href = 'login.html'; }
    async function checkAuth() { const { data: { session } } = await supabase.auth.getSession(); if (!session) window.location.href = 'login.html'; }
    checkAuth(); loadPatients();
    document.getElementById('searchInput').addEventListener('keyup', searchPatients);
</script>
</body>
</html>
