<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patients - Wellmeadows Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: #f1f5f9;
        }

        /* Sidebar Styles */
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            height: 100%;
            width: 280px;
            background: linear-gradient(180deg, #0f2b3d 0%, #0a1e2c 100%);
            color: #e2e8f0;
            transition: all 0.3s;
            z-index: 100;
            overflow-y: auto;
        }
        .sidebar.closed {
            width: 80px;
        }
        .sidebar.closed .sidebar-nav span,
        .sidebar.closed .logo-text,
        .sidebar.closed .logo-sub,
        .sidebar.closed .user-details {
            display: none;
        }
        .sidebar.closed .sidebar-nav .nav-item {
            justify-content: center;
            padding: 12px;
        }
        .sidebar-header {
            padding: 24px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .logo-icon {
            font-size: 2rem;
            color: #4db8ff;
        }
        .logo-text {
            font-size: 1.3rem;
            font-weight: 700;
            color: white;
        }
        .logo-sub {
            font-size: 0.7rem;
            color: #94a3b8;
            margin-top: 6px;
            padding-left: 52px;
        }
        .toggle-btn {
            position: absolute;
            top: 20px;
            right: -12px;
            background: #287b9e;
            border: 2px solid #0f2b3d;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: white;
            z-index: 101;
        }
        .sidebar-nav {
            padding: 0 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 16px;
            border-radius: 12px;
            color: #cbd5e6;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.9rem;
            transition: all 0.2s;
        }
        .nav-item i {
            width: 24px;
        }
        .nav-item:hover {
            background: rgba(77, 184, 255, 0.12);
            color: white;
        }
        .nav-item.active {
            background: #287b9e;
            color: white;
        }
        .sidebar-footer {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }
        .user-avatar {
            width: 40px;
            height: 40px;
            background: #287b9e;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .user-name {
            font-weight: 600;
            font-size: 0.85rem;
            color: white;
        }
        .logout-btn {
            width: 100%;
            background: rgba(220, 38, 38, 0.2);
            border: none;
            color: #fca5a5;
            padding: 10px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .logout-btn:hover {
            background: rgba(220, 38, 38, 0.4);
            color: white;
        }

        /* Main Content */
        .main-content {
            margin-left: 280px;
            padding: 24px 32px;
            transition: all 0.3s;
            min-height: 100vh;
        }
        .main-content.expanded {
            margin-left: 80px;
        }
        .page-header {
            margin-bottom: 32px;
        }
        .page-header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            color: #0f2b3d;
            margin-bottom: 8px;
        }
        .page-header p {
            color: #64748b;
            font-size: 0.9rem;
        }

        /* Filter Section */
        .filter-section {
            background: white;
            border-radius: 20px;
            padding: 20px 24px;
            margin-bottom: 24px;
            border: 1px solid #e2e8f0;
            display: flex;
            gap: 16px;
            align-items: flex-end;
            flex-wrap: wrap;
        }
        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .filter-group label {
            font-size: 0.75rem;
            font-weight: 600;
            color: #475569;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .filter-group input {
            padding: 10px 16px;
            border: 1.5px solid #e2e8f0;
            border-radius: 12px;
            font-size: 0.9rem;
            width: 250px;
            font-family: 'Inter', sans-serif;
        }
        .filter-group input:focus {
            outline: none;
            border-color: #287b9e;
        }
        .btn-search, .btn-reset {
            padding: 10px 24px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.85rem;
            border: none;
        }
        .btn-search {
            background: #287b9e;
            color: white;
        }
        .btn-search:hover {
            background: #1a5f7a;
        }
        .btn-reset {
            background: #f1f5f9;
            color: #475569;
            border: 1px solid #e2e8f0;
        }
        .btn-reset:hover {
            background: #e2e8f0;
        }

        /* Card */
        .card {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid #e2e8f0;
        }
        .card-header {
            padding: 20px 24px;
            border-bottom: 1px solid #eef2f8;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .card-header h2 {
            font-size: 1rem;
            font-weight: 600;
            color: #0f2b3d;
        }
        .refresh-btn {
            background: none;
            border: none;
            color: #287b9e;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
        }
        .refresh-btn:hover {
            text-decoration: underline;
        }

        /* Table */
        .table-wrapper {
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 14px 16px;
            text-align: left;
            border-bottom: 1px solid #eef2f8;
            font-size: 0.85rem;
        }
        th {
            background: #f8fafc;
            font-weight: 600;
            color: #0f2b3d;
        }
        tr:hover td {
            background: #fafcff;
        }
        .empty-state {
            text-align: center;
            padding: 48px;
            color: #94a3b8;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .sidebar {
                width: 80px;
            }
            .sidebar .logo-text,
            .sidebar .logo-sub,
            .sidebar .user-details {
                display: none;
            }
            .sidebar .nav-item {
                justify-content: center;
                padding: 12px;
            }
            .sidebar .nav-item span {
                display: none;
            }
            .main-content {
                margin-left: 80px;
                padding: 20px;
            }
            .filter-section {
                flex-direction: column;
                align-items: stretch;
            }
            .filter-group input {
                width: 100%;
            }
        }
    </style>
</head>
<body>

<aside class="sidebar" id="sidebar">
    <div class="toggle-btn" id="toggleSidebar">
        <i class="fas fa-chevron-left"></i>
    </div>
    <div class="sidebar-header">
        <div class="logo-area">
            <i class="fas fa-hospital-user logo-icon"></i>
            <div class="logo-text">Wellmeadows</div>
        </div>
        <div class="logo-sub">Admin Portal</div>
    </div>
    <nav class="sidebar-nav">
        <a href="index.html" class="nav-item"><i class="fas fa-chalkboard-user"></i><span>Dashboard</span></a>
        <a href="appointments.html" class="nav-item"><i class="fas fa-calendar-check"></i><span>Appointments</span></a>
        <a href="calendar.html" class="nav-item"><i class="fas fa-calendar-alt"></i><span>Calendar</span></a>
        <a href="patients.html" class="nav-item active"><i class="fas fa-users"></i><span>Patients</span></a>
        <a href="staff-schedule.html" class="nav-item"><i class="fas fa-user-md"></i><span>Staff Schedule</span></a>
        <a href="reports.html" class="nav-item"><i class="fas fa-chart-line"></i><span>Reports</span></a>
    </nav>
    <div class="sidebar-footer">
        <div class="user-info">
            <div class="user-avatar"><i class="fas fa-user-circle"></i></div>
            <div class="user-details">
                <div class="user-name" id="adminName">Admin</div>
            </div>
        </div>
        <button class="logout-btn" id="logoutBtn">Logout</button>
    </div>
</aside>

<main class="main-content" id="mainContent">
    <div class="page-header">
        <h1>Patient Records</h1>
        <p>View and manage all registered patients</p>
    </div>

    <!-- Filter Section -->
    <div class="filter-section">
        <div class="filter-group">
            <label>Search</label>
            <input type="text" id="searchInput" placeholder="Name, email, or phone...">
        </div>
        <button class="btn-search" onclick="applyFilter()">Search</button>
        <button class="btn-reset" onclick="resetFilter()">Reset</button>
    </div>

    <!-- Patients Table -->
    <div class="card">
        <div class="card-header">
            <h2>All Patients</h2>
            <button class="refresh-btn" onclick="loadPatients()">Refresh</button>
        </div>
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Full Name</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Blood Type</th>
                        <th>Registered Date</th>
                    </tr>
                </thead>
                <tbody id="patientsTable">
                    <tr>
                        <td colspan="6" class="empty-state">Loading patients...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<script>
    const SUPABASE_URL = 'https://cqetejeaeasqkafdgjri.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_75JVFc0QWySSyAPQVO-C1g_Udqt9tgQ';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let allPatients = [];

    async function loadPatients() {
        const { data, error } = await supabaseClient
            .from('patient')
            .select('*')
            .order('patient_id', { ascending: true });
        
        if (error) {
            console.error('Error loading patients:', error);
            document.getElementById('patientsTable').innerHTML = '<tr><td colspan="6" class="empty-state">Error loading patients</td></tr>';
            return;
        }
        
        allPatients = data || [];
        renderPatients(allPatients);
    }

    function renderPatients(patients) {
        const tbody = document.getElementById('patientsTable');
        
        if (patients.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" class="empty-state">No patients found</td></tr>';
            return;
        }
        
        tbody.innerHTML = patients.map(patient => `
            <tr>
                <td>${patient.patient_id}</td>
                <td><strong>${patient.first_name} ${patient.last_name}</strong></td>
                <td>${patient.email || '-'}</td>
                <td>${patient.phone || '-'}</td>
                <td>${patient.blood_type || '-'}</td>
                <td>${patient.date_registered || '-'}</td>
            </tr>
        `).join('');
    }

    function applyFilter() {
        const searchTerm = document.getElementById('searchInput').value.toLowerCase();
        
        if (!searchTerm) {
            renderPatients(allPatients);
            return;
        }
        
        const filtered = allPatients.filter(patient => 
            `${patient.first_name} ${patient.last_name}`.toLowerCase().includes(searchTerm) ||
            (patient.email && patient.email.toLowerCase().includes(searchTerm)) ||
            (patient.phone && patient.phone.includes(searchTerm))
        );
        
        renderPatients(filtered);
    }

    function resetFilter() {
        document.getElementById('searchInput').value = '';
        renderPatients(allPatients);
    }

    // Sidebar toggle
    const sidebar = document.getElementById('sidebar');
    const mainContent = document.getElementById('mainContent');
    const toggleBtn = document.getElementById('toggleSidebar');
    if (toggleBtn) {
        toggleBtn.addEventListener('click', () => {
            sidebar.classList.toggle('closed');
            mainContent.classList.toggle('expanded');
        });
    }

    // Logout
    const logoutBtn = document.getElementById('logoutBtn');
    if (logoutBtn) {
        logoutBtn.addEventListener('click', async () => {
            await supabaseClient.auth.signOut();
            window.location.href = 'login.html';
        });
    }

    // Auth check
    async function checkAuth() {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (!session) {
            window.location.href = 'login.html';
            return;
        }
        
        const { data: staff } = await supabaseClient
            .from('staff')
            .select('first_name, last_name')
            .eq('email', session.user.email)
            .single();
        
        if (staff) {
            document.getElementById('adminName').textContent = `${staff.first_name} ${staff.last_name}`;
        }
    }

    // Initialize
    checkAuth();
    loadPatients();
</script>
</body>
</html>
