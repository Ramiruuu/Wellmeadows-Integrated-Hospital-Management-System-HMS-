<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Management - Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #f1f5f9; }
        .top-bar {
            background: #0f2b3d;
            padding: 16px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo { font-size: 1.3rem; font-weight: 600; color: white; }
        .logo span { color: #4db8ff; }
        .nav-links a {
            color: #94a3b8;
            text-decoration: none;
            margin-left: 28px;
            font-weight: 500;
        }
        .nav-links a:hover, .nav-links a.active { color: white; }
        .user-info { display: flex; align-items: center; gap: 16px; }
        .logout-btn {
            background: rgba(220,38,38,0.2);
            border: none;
            color: #fca5a5;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
        }
        .container { max-width: 1400px; margin: 0 auto; padding: 32px; }
        .page-header { margin-bottom: 24px; }
        .page-header h1 { font-size: 1.8rem; color: #0f2b3d; }
        .card {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            margin-bottom: 32px;
        }
        .card-header {
            padding: 20px 24px;
            border-bottom: 1px solid #e2e8f0;
            font-weight: 600;
            color: #0f2b3d;
        }
        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-size: 0.7rem;
            font-weight: 600;
            color: #475569;
            margin-bottom: 6px;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 10px 12px;
            border: 1.5px solid #e2e8f0;
            border-radius: 10px;
            font-size: 0.85rem;
        }
        .btn-primary {
            background: #287b9e;
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
        }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px 16px; text-align: left; border-bottom: 1px solid #eef2f8; font-size: 0.85rem; }
        th { background: #f8fafc; font-weight: 600; color: #0f2b3d; }
        .empty-state { text-align: center; padding: 48px; color: #94a3b8; }
    </style>
</head>
<body>
    <div class="top-bar">
        <div class="logo">Wellmeadows <span>Admin</span></div>
        <div class="nav-links">
            <a href="index.html">Dashboard</a>
            <a href="appointments.html">Appointments</a>
            <a href="patients.html">Patients</a>
            <a href="staff-management.html" class="active">Staff</a>
        </div>
        <div class="user-info">
            <span id="adminName">Admin</span>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>
    </div>

    <div class="container">
        <div class="page-header">
            <h1>Staff Management</h1>
        </div>

        <div class="card">
            <div class="card-header">Add New Staff Member</div>
            <div style="padding: 24px;">
                <form id="staffForm">
                    <div class="form-row">
                        <div class="form-group"><label>First Name</label><input type="text" id="firstName" required></div>
                        <div class="form-group"><label>Last Name</label><input type="text" id="lastName" required></div>
                        <div class="form-group"><label>Email</label><input type="email" id="email" required></div>
                    </div>
                    <div class="form-row">
                        <div class="form-group"><label>Position</label>
                            <select id="position">
                                <option value="Doctor">Doctor</option>
                                <option value="Nurse">Nurse</option>
                                <option value="Administrative Staff">Administrative Staff</option>
                                <option value="Manager">Manager</option>
                            </select>
                        </div>
                        <div class="form-group"><label>Phone</label><input type="tel" id="phone"></div>
                        <div class="form-group"><label>Password (for login)</label><input type="password" id="password" required></div>
                    </div>
                    <button type="submit" class="btn-primary">Add Staff</button>
                </form>
            </div>
        </div>

        <div class="card">
            <div class="card-header">Staff Directory</div>
            <div class="table-wrapper">
                <table>
                    <thead><tr><th>ID</th><th>Name</th><th>Position</th><th>Email</th><th>Phone</th><th>Actions</th></tr></thead>
                    <tbody id="staffTable"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="../shared/supabase-config.js"></script>
    <script>
        const SUPABASE_URL = 'https://cqetejeaeasqkafdgjri.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_75JVFc0QWySSyAPQVO-C1g_Udqt9tgQ';
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let staffList = [];

        async function loadStaff() {
            const { data } = await supabase.from('staff').select('*').order('staff_id');
            staffList = data || [];
            renderStaff();
        }

        function renderStaff() {
            const tbody = document.getElementById('staffTable');
            if (staffList.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="empty-state">No staff members</td></tr>';
                return;
            }
            tbody.innerHTML = staffList.map(s => `
                <tr>
                    <td>${s.staff_id}</td>
                    <td><strong>${s.first_name} ${s.last_name}</strong></td>
                    <td>${s.position}</td>
                    <td>${s.email}</td>
                    <td>${s.phone || '-'}</td>
                    <td><button onclick="deleteStaff(${s.staff_id})" style="background:#dc2626;border:none;color:white;padding:4px 12px;border-radius:6px;cursor:pointer;">Delete</button></td>
                </tr>
            `).join('');
        }

        async function deleteStaff(id) {
            if (confirm('Delete this staff member?')) {
                await supabase.from('staff').delete().eq('staff_id', id);
                loadStaff();
            }
        }

        document.getElementById('staffForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const firstName = document.getElementById('firstName').value;
            const lastName = document.getElementById('lastName').value;
            const email = document.getElementById('email').value;
            const position = document.getElementById('position').value;
            const phone = document.getElementById('phone').value;
            const password = document.getElementById('password').value;
            
            try {
                // Create auth user in Supabase
                const { data: authUser, error: authError } = await supabase.auth.signUp({
                    email: email,
                    password: password
                });
                if (authError) throw authError;
                
                // Create staff record
                const { error: staffError } = await supabase.from('staff').insert([{
                    first_name: firstName,
                    last_name: lastName,
                    email: email,
                    position: position,
                    phone: phone,
                    firebase_uid: authUser.user?.id
                }]);
                if (staffError) throw staffError;
                
                alert('Staff added successfully');
                document.getElementById('staffForm').reset();
                loadStaff();
            } catch (error) {
                alert('Error: ' + error.message);
            }
        });

        async function logout() {
            await supabase.auth.signOut();
            window.location.href = 'login.html';
        }

        loadStaff();
    </script>
</body>
</html>
