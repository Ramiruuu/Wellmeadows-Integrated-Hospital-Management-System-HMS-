<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Registration - Wellmeadows</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f2b3d 0%, #1a4a6e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .register-container {
            background: white;
            border-radius: 28px;
            width: 100%;
            max-width: 520px;
            overflow: hidden;
        }
        .register-header {
            background: #0f2b3d;
            padding: 36px;
            text-align: center;
        }
        .register-header h1 { color: white; font-size: 1.6rem; margin-bottom: 8px; }
        .register-body { padding: 36px; }
        .form-group { margin-bottom: 20px; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        label { display: block; font-weight: 600; font-size: 0.7rem; color: #475569; margin-bottom: 8px; text-transform: uppercase; }
        .input-wrapper { position: relative; }
        .input-wrapper i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #94a3b8; }
        input {
            width: 100%;
            padding: 14px 16px 14px 46px;
            border: 1.5px solid #e2e8f0;
            border-radius: 14px;
            font-size: 0.9rem;
        }
        input:focus { outline: none; border-color: #287b9e; }
        .btn-register {
            width: 100%;
            background: #287b9e;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
        }
        .login-link { text-align: center; margin-top: 24px; font-size: 0.85rem; }
        .login-link a { color: #287b9e; text-decoration: none; }
        .alert { padding: 14px; border-radius: 14px; margin-bottom: 24px; }
        .alert-error { background: #fee2e2; color: #b91c1c; }
        .alert-success { background: #dcfce7; color: #15803d; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="register-container">
        <div class="register-header">
            <h1>Create Account</h1>
            <p>Register to book appointments online</p>
        </div>
        <div class="register-body">
            <div id="alertMessage" class="alert hidden"></div>
            <form id="registerForm">
                <div class="form-row">
                    <div class="form-group">
                        <label>First Name</label>
                        <div class="input-wrapper"><i class="fas fa-user"></i><input type="text" id="firstName" required></div>
                    </div>
                    <div class="form-group">
                        <label>Last Name</label>
                        <div class="input-wrapper"><i class="fas fa-user"></i><input type="text" id="lastName" required></div>
                    </div>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <div class="input-wrapper"><i class="fas fa-envelope"></i><input type="email" id="email" required></div>
                </div>
                <div class="form-group">
                    <label>Phone</label>
                    <div class="input-wrapper"><i class="fas fa-phone"></i><input type="tel" id="phone" required></div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Password</label>
                        <div class="input-wrapper"><i class="fas fa-lock"></i><input type="password" id="password" required></div>
                    </div>
                    <div class="form-group">
                        <label>Confirm</label>
                        <div class="input-wrapper"><i class="fas fa-lock"></i><input type="password" id="confirmPassword" required></div>
                    </div>
                </div>
                <button type="submit" class="btn-register">Create Account</button>
            </form>
            <div class="login-link">Already have an account? <a href="login.html">Sign In</a></div>
        </div>
    </div>
    
    <script type="module">
        import { auth, createUserWithEmailAndPassword } from './assets/js/firebase-config.js';
        
        const SUPABASE_URL = 'https://cqetejeaeasqkafdgjri.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_75JVFc0QWySSyAPQVO-C1g_Udqt9tgQ';
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        const form = document.getElementById('registerForm');
        const alertDiv = document.getElementById('alertMessage');
        
        function showAlert(message, type) {
            alertDiv.className = `alert alert-${type}`;
            alertDiv.innerHTML = `<i class="fas fa-${type === 'error' ? 'exclamation-circle' : 'check-circle'}"></i> ${message}`;
            alertDiv.classList.remove('hidden');
            setTimeout(() => alertDiv.classList.add('hidden'), 5000);
        }
        
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const firstName = document.getElementById('firstName').value;
            const lastName = document.getElementById('lastName').value;
            const email = document.getElementById('email').value;
            const phone = document.getElementById('phone').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            if (password !== confirmPassword) {
                showAlert('Passwords do not match', 'error');
                return;
            }
            
            if (password.length < 6) {
                showAlert('Password must be at least 6 characters', 'error');
                return;
            }
            
            showAlert('Creating account...', 'success');
            
            try {
                // Create Firebase user
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const firebaseUser = userCredential.user;
                console.log('Firebase user created:', firebaseUser.uid);
                
                // Create patient record in Supabase
                const { error: supabaseError } = await supabase
                    .from('patient')
                    .insert([{
                        first_name: firstName,
                        last_name: lastName,
                        email: email,
                        phone: phone,
                        firebase_uid: firebaseUser.uid,
                        date_registered: new Date().toISOString().split('T')[0]
                    }]);
                
                if (supabaseError) throw supabaseError;
                
                showAlert('Registration successful! Redirecting to login...', 'success');
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 2000);
                
            } catch (error) {
                console.error('Registration error:', error);
                let message = error.message;
                if (error.code === 'auth/email-already-in-use') {
                    message = 'Email already registered. Please login instead.';
                }
                showAlert(message, 'error');
            }
        });
    </script>
</body>
</html>
