<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medical Records - Wellmeadows</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #f1f5f9; }

        /* Sidebar - Same as Dashboard */
        .sidebar {
            position: fixed; top: 0; left: 0; height: 100%; width: 280px;
            background: linear-gradient(180deg, #0f2b3d 0%, #0a1e2c 100%);
            color: #e2e8f0; transition: all 0.3s; z-index: 100; overflow-y: auto;
        }
        .sidebar.closed { width: 80px; }
        .sidebar.closed .sidebar-nav span, .sidebar.closed .logo-text, 
        .sidebar.closed .logo-sub, .sidebar.closed .user-details { display: none; }
        .sidebar.closed .sidebar-nav .nav-item { justify-content: center; padding: 12px; }
        
        .sidebar-header { padding: 24px; border-bottom: 1px solid rgba(255,255,255,0.08); }
        .logo-area { display: flex; align-items: center; gap: 12px; }
        .logo-icon { font-size: 2rem; color: #4db8ff; }
        .logo-text { font-size: 1.3rem; font-weight: 700; color: white; }
        .logo-sub { font-size: 0.7rem; color: #94a3b8; margin-top: 6px; padding-left: 52px; }
        
        .toggle-btn {
            position: absolute; top: 20px; right: -12px; background: #287b9e;
            border: 2px solid #0f2b3d; border-radius: 50%; width: 28px; height: 28px;
            display: flex; align-items: center; justify-content: center; cursor: pointer;
            color: white; z-index: 101;
        }
        
        .sidebar-nav { padding: 0 16px; display: flex; flex-direction: column; gap: 8px; }
        .nav-item {
            display: flex; align-items: center; gap: 14px; padding: 12px 16px;
            border-radius: 12px; color: #cbd5e6; text-decoration: none;
            font-weight: 500; font-size: 0.9rem; transition: all 0.2s;
        }
        .nav-item i { width: 24px; font-size: 1.1rem; }
        .nav-item:hover { background: rgba(77,184,255,0.12); color: white; }
        .nav-item.active { background: #287b9e; color: white; }
        
        .sidebar-footer {
            position: absolute; bottom: 0; left: 0; right: 0; padding: 20px;
            border-top: 1px solid rgba(255,255,255,0.08);
        }
        .user-info { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
        .user-avatar { width: 40px; height: 40px; background: #287b9e; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .user-name { font-weight: 600; font-size: 0.85rem; color: white; }
        .logout-btn {
            width: 100%; background: rgba(220,38,38,0.2); border: none; color: #fca5a5;
            padding: 10px; border-radius: 10px; cursor: pointer; display: flex;
            align-items: center; justify-content: center; gap: 8px;
        }
        .logout-btn:hover { background: rgba(220,38,38,0.4); color: white; }

        /* Main Content */
        .main-content { margin-left: 280px; padding: 24px 32px; transition: all 0.3s; min-height: 100vh; }
        .main-content.expanded { margin-left: 80px; }
        .top-header { margin-bottom: 32px; }
        .top-header h1 { font-size: 1.8rem; font-weight: 700; color: #0f2b3d; margin-bottom: 8px; }
        .top-header p { color: #64748b; }

        /* Card & Table */
        .card { background: white; border-radius: 20px; overflow: hidden; border: 1px solid #e2e8f0; }
        .table-wrapper { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 14px 16px; text-align: left; border-bottom: 1px solid #eef2f8; font-size: 0.85rem; }
        th { background: #f8fafc; font-weight: 600; color: #0f2b3d; }
        
        .status-badge {
            display: inline-block; padding: 4px 10px; border-radius: 20px;
            font-size: 0.65rem; font-weight: 600;
        }
        .status-active { background: #dcfce7; color: #15803d; }
        .status-completed { background: #dbeafe; color: #2563eb; }
        
        .empty-state { text-align: center; padding: 48px; color: #94a3b8; }

        @media (max-width: 768px) {
            .sidebar { width: 80px; }
            .sidebar .logo-text, .sidebar .logo-sub, .sidebar .user-details { display: none; }
            .sidebar .nav-item { justify-content: center; padding: 12px; }
            .sidebar .nav-item span { display: none; }
            .main-content { margin-left: 80px; padding: 20px; }
        }
    </style>
</head>
<body>

<aside class="sidebar" id="sidebar">
    <div class="toggle-btn" id="toggleSidebar"><i class="fas fa-chevron-left"></i></div>
    <div class="sidebar-header">
        <div class="logo-area"><i class="fas fa-hospital-user logo-icon"></i><div class="logo-text">Wellmeadows</div></div>
        <div class="logo-sub">Patient Portal</div>
    </div>
    <nav class="sidebar-nav">
        <a href="index.html" class="nav-item"><i class="fas fa-chalkboard-user"></i><span>Dashboard</span></a>
        <a href="book-appointment.html" class="nav-item"><i class="fas fa-calendar-plus"></i><span>Book Appointment</span></a>
        <a href="my-appointments.html" class="nav-item"><i class="fas fa-calendar-check"></i><span>My Appointments</span></a>
        <a href="doctors.html" class="nav-item"><i class="fas fa-user-md"></i><span>Our Doctors</span></a>
        <a href="medical-records.html" class="nav-item active"><i class="fas fa-notes-medical"></i><span>Medical Records</span></a>
    <div class="sidebar-footer">
        <div class="user-info"><div class="user-avatar"><i class="fas fa-user-circle"></i></div><div class="user-details"><div class="user-name" id="userName">Patient</div></div></div>
        <button class="logout-btn" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</button>
    </div>
</aside>

<main class="main-content" id="mainContent">
    <div class="top-header">
        <h1>Medical Records</h1>
        <p>Your complete treatment and consultation history</p>
    </div>
    <div class="card">
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Doctor</th>
                        <th>Diagnosis</th>
                        <th>Treatment</th>
                        <th>Medications</th>
                        <th>Follow-up</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="recordsTable">
                    <tr><td colspan="7" class="empty-state">Loading medical records...</div></td></tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<script type="module">
    import { auth, onAuthStateChanged, signOut } from './assets/js/firebase-config.js';

    // Supabase client
    const SUPABASE_URL = 'https://cqetejeaeasqkafdgjri.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_75JVFc0QWySSyAPQVO-C1g_Udqt9tgQ';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUser = null;
    let patientData = null;

    // Get patient from Supabase by email
    async function getPatientByEmail(email) {
        try {
            const { data, error } = await supabaseClient
                .from('patient')
                .select('patient_id, first_name, last_name')
                .eq('email', email)
                .maybeSingle();
            
            if (error) throw error;
            return data;
        } catch (error) {
            console.error('Error fetching patient:', error);
            return null;
        }
    }

    // Load treatments/medical records from Supabase
    async function loadMedicalRecords() {
        if (!patientData?.patient_id) {
            const tbody = document.getElementById('recordsTable');
            tbody.innerHTML = '<tr><td colspan="7" class="empty-state">No medical records found</td></tr>';
            return;
        }
        
        try {
            // Fetch treatments from the treatment table
            const { data, error } = await supabaseClient
                .from('treatment')
                .select(`
                    treatment_id,
                    treatment_date,
                    diagnosis,
                    treatment_description,
                    medications,
                    follow_up_date,
                    status,
                    staff:staff_id (
                        first_name,
                        last_name,
                        position
                    )
                `)
                .eq('patient_id', patientData.patient_id)
                .order('treatment_date', { ascending: false });
            
            if (error) throw error;
            
            const records = data || [];
            renderRecords(records);
        } catch (error) {
            console.error('Error loading medical records:', error);
            const tbody = document.getElementById('recordsTable');
            tbody.innerHTML = '<tr><td colspan="7" class="empty-state">Error loading medical records</td></tr>';
        }
    }

    function renderRecords(records) {
        const tbody = document.getElementById('recordsTable');
        
        if (records.length === 0) {
            tbody.innerHTML = '<tr><td colspan="7" class="empty-state">No medical records found</td></tr>';
            return;
        }
        
        tbody.innerHTML = records.map(rec => {
            const doctor = rec.staff;
            const doctorName = doctor ? `Dr. ${doctor.first_name} ${doctor.last_name}` : 'Doctor';
            
            let statusClass = rec.status === 'Active' ? 'status-active' : 'status-completed';
            let statusText = rec.status || 'Completed';
            
            return `
                <tr>
                    <td>${rec.treatment_date ? new Date(rec.treatment_date).toLocaleDateString() : '-'}</td>
                    <td><strong>${doctorName}</strong><br><small style="color:#64748b;">${doctor?.position || ''}</small></td>
                    <td>${rec.diagnosis || '-'}</td>
                    <td>${rec.treatment_description || '-'}</td>
                    <td>${rec.medications || '-'}</td>
                    <td>${rec.follow_up_date ? new Date(rec.follow_up_date).toLocaleDateString() : '-'}</td>
                    <td><span class="status-badge ${statusClass}">${statusText}</span></td>
                </tr>
            `;
        }).join('');
    }

    // Load patient name for sidebar
    async function loadPatientName() {
        if (!currentUser) return;
        
        try {
            const { data, error } = await supabaseClient
                .from('patient')
                .select('first_name, last_name')
                .eq('email', currentUser.email)
                .maybeSingle();
            
            if (data) {
                const fullName = `${data.first_name || ''} ${data.last_name || ''}`.trim();
                document.getElementById('userName').innerHTML = fullName || 'Patient';
            } else if (currentUser.displayName) {
                document.getElementById('userName').innerHTML = currentUser.displayName;
            } else {
                document.getElementById('userName').innerHTML = currentUser.email.split('@')[0];
            }
        } catch (error) {
            console.error('Error loading patient name:', error);
        }
    }

    // Sidebar toggle
    const sidebar = document.getElementById('sidebar');
    const mainContent = document.getElementById('mainContent');
    const toggleBtn = document.getElementById('toggleSidebar');
    if (toggleBtn) {
        toggleBtn.addEventListener('click', () => {
            sidebar.classList.toggle('closed');
            mainContent.classList.toggle('expanded');
        });
    }

    // Logout
    const logoutBtn = document.getElementById('logoutBtn');
    if (logoutBtn) {
        logoutBtn.addEventListener('click', async () => {
            await signOut(auth);
            window.location.href = 'login.html';
        });
    }

    // Initialize - Get logged in user from Firebase Auth
    onAuthStateChanged(auth, async (user) => {
        if (!user) {
            window.location.href = 'login.html';
            return;
        }
        currentUser = user;
        
        // Get patient record from Supabase
        patientData = await getPatientByEmail(currentUser.email);
        await loadPatientName();
        await loadMedicalRecords();
    });
</script>
</body>
</html>
