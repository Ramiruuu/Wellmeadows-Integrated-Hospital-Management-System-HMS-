<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Login - Wellmeadows</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f2b3d 0%, #1a4a6e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .login-container {
            background: white;
            border-radius: 28px;
            width: 100%;
            max-width: 460px;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
        }
        .login-header {
            background: #0f2b3d;
            padding: 36px;
            text-align: center;
        }
        .login-header h1 { color: white; font-size: 1.6rem; margin-bottom: 8px; }
        .login-header p { color: #94a3b8; font-size: 0.85rem; }
        .login-body { padding: 36px; }
        .form-group { margin-bottom: 24px; }
        label { display: block; font-weight: 600; font-size: 0.7rem; color: #475569; margin-bottom: 8px; text-transform: uppercase; }
        .input-wrapper { position: relative; }
        .input-wrapper i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #94a3b8; }
        input {
            width: 100%;
            padding: 14px 16px 14px 46px;
            border: 1.5px solid #e2e8f0;
            border-radius: 14px;
            font-size: 0.9rem;
        }
        input:focus { outline: none; border-color: #287b9e; }
        .btn-login {
            width: 100%;
            background: #287b9e;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 12px;
        }
        .btn-login:hover { background: #1a5f7a; }
        .google-btn {
            width: 100%;
            background: white;
            color: #333;
            border: 1.5px solid #e2e8f0;
            padding: 14px;
            border-radius: 40px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .google-btn:hover { background: #f8fafc; border-color: #287b9e; }
        .divider { text-align: center; margin: 20px 0; position: relative; color: #94a3b8; font-size: 0.8rem; }
        .divider::before, .divider::after { content: ''; position: absolute; top: 50%; width: 45%; height: 1px; background: #e2e8f0; }
        .divider::before { left: 0; }
        .divider::after { right: 0; }
        .register-link { text-align: center; margin-top: 24px; font-size: 0.85rem; color: #64748b; }
        .register-link a { color: #287b9e; text-decoration: none; }
        .alert { padding: 14px; border-radius: 14px; margin-bottom: 24px; font-size: 0.85rem; display: flex; align-items: center; gap: 10px; }
        .alert-error { background: #fee2e2; color: #b91c1c; }
        .alert-success { background: #dcfce7; color: #15803d; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>Patient Portal</h1>
            <p>Book and manage your appointments</p>
        </div>
        <div class="login-body">
            <div id="alertMessage" class="alert hidden"></div>
            <form id="loginForm">
                <div class="form-group">
                    <label>Email Address</label>
                    <div class="input-wrapper"><i class="fas fa-envelope"></i><input type="email" id="email" placeholder="you@example.com" required></div>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <div class="input-wrapper"><i class="fas fa-lock"></i><input type="password" id="password" placeholder="Enter your password" required></div>
                </div>
                <button type="submit" class="btn-login"><i class="fas fa-sign-in-alt"></i> Sign In</button>
            </form>
            <div class="divider">OR</div>
            <button id="googleSignInBtn" class="google-btn"><i class="fab fa-google"></i> Sign in with Google</button>
            <div class="register-link">Don't have an account? <a href="register.html">Register Here</a></div>
        </div>
    </div>
    
    <script type="module">
        import { auth, signInWithEmailAndPassword, onAuthStateChanged, googleProvider, signInWithPopup } from './assets/js/firebase-config.js';
        
        const form = document.getElementById('loginForm');
        const alertDiv = document.getElementById('alertMessage');
        
        function showAlert(message, type) {
            alertDiv.className = `alert alert-${type}`;
            alertDiv.innerHTML = `<i class="fas fa-${type === 'error' ? 'exclamation-circle' : 'check-circle'}"></i> ${message}`;
            alertDiv.classList.remove('hidden');
            setTimeout(() => alertDiv.classList.add('hidden'), 5000);
        }
        
        // Check if already logged in
        onAuthStateChanged(auth, (user) => {
            if (user) {
                window.location.href = 'index.html';
            }
        });
        
        // Email/Password Login
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            showAlert('Logging in...', 'success');
            
            try {
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                console.log('Login success:', userCredential.user.email);
                showAlert('Login successful! Redirecting...', 'success');
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1500);
            } catch (error) {
                console.error('Login error:', error);
                let message = error.message;
                if (error.code === 'auth/user-not-found') {
                    message = 'No account found with this email. Please register first.';
                } else if (error.code === 'auth/wrong-password') {
                    message = 'Incorrect password. Please try again.';
                }
                showAlert(message, 'error');
            }
        });
        
        // Google Sign In
        document.getElementById('googleSignInBtn').addEventListener('click', async () => {
            showAlert('Redirecting to Google...', 'success');
            try {
                const result = await signInWithPopup(auth, googleProvider);
                console.log('Google login success:', result.user.email);
                showAlert('Google login successful! Redirecting...', 'success');
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1500);
            } catch (error) {
                console.error('Google login error:', error);
                showAlert(error.message, 'error');
            }
        });
    </script>
</body>
</html>
