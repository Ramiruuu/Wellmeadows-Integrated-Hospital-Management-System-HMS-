    <script src="../shared/supabase-config.js"></script>
    <script type="module">
        import { auth, onAuthStateChanged } from './assets/js/firebase-config.js';
        
        const SUPABASE_URL = 'https://cqetejeaeasqkafdgjri.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_75JVFc0QWySSyAPQVO-C1g_Udqt9tgQ';
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const urlParams = new URLSearchParams(window.location.search);
        const doctorId = urlParams.get('doctor');
        const doctorName = urlParams.get('name') || 'our doctor';
        
        document.getElementById('doctorInfo').innerHTML = `Selected Doctor: <strong>Dr. ${doctorName}</strong>`;

        async function sendEmailConfirmation(to, name, details) {
            try {
                // For demo, we'll simulate email sending
                // In production, you would call a Supabase Edge Function
                console.log(`Email would be sent to: ${to}`);
                console.log(`Subject: Appointment Confirmation - Wellmeadows Hospital`);
                console.log(`Body: Dear ${name}, your appointment with Dr. ${details.doctorName} on ${details.date} at ${details.time} is confirmed.`);
                
                // Simulate API call
                await new Promise(resolve => setTimeout(resolve, 500));
                return true;
            } catch (error) {
                console.error('Email error:', error);
                return false;
            }
        }

        document.getElementById('appointmentForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const messageDiv = document.getElementById('message');
            messageDiv.className = 'message';
            messageDiv.textContent = 'Processing your appointment...';
            
            try {
                const patientName = document.getElementById('patientName').value;
                const patientEmail = document.getElementById('patientEmail').value;
                const patientPhone = document.getElementById('patientPhone').value;
                const appointmentDate = document.getElementById('appointmentDate').value;
                const appointmentTime = document.getElementById('appointmentTime').value;
                const reason = document.getElementById('reason').value;
                
                // Check if patient exists, if not create
                let { data: patient } = await supabase
                    .from('patient')
                    .select('*')
                    .eq('email', patientEmail)
                    .single();
                
                if (!patient) {
                    const nameParts = patientName.split(' ');
                    const { data: newPatient } = await supabase
                        .from('patient')
                        .insert([{
                            first_name: nameParts[0],
                            last_name: nameParts.slice(1).join(' ') || 'Patient',
                            email: patientEmail,
                            phone: patientPhone,
                            date_registered: new Date().toISOString().split('T')[0]
                        }])
                        .select();
                    patient = newPatient[0];
                }
                
                // Create appointment
                const { data: appointment, error } = await supabase
                    .from('appointment')
                    .insert([{
                        patient_id: patient.patient_id,
                        staff_id: parseInt(doctorId),
                        appointment_date: appointmentDate,
                        appointment_time: appointmentTime,
                        reason: reason,
                        status: 'Scheduled'
                    }])
                    .select();
                
                if (error) throw error;
                
                // Send email confirmation
                const emailSent = await sendEmailConfirmation(patientEmail, patientName, {
                    doctorName: doctorName,
                    date: appointmentDate,
                    time: appointmentTime,
                    reason: reason
                });
                
                messageDiv.className = 'message success';
                messageDiv.innerHTML = `✅ Appointment confirmed! ${emailSent ? 'A confirmation email has been sent to your email address.' : ''}<br>Redirecting to your appointments...`;
                
                setTimeout(() => {
                    window.location.href = 'my-appointments.html';
                }, 3000);
                
            } catch (error) {
                messageDiv.className = 'message error';
                messageDiv.textContent = 'Error: ' + error.message;
            }
        });
        
        // Auto-fill if user is logged in
        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('patientEmail').value = user.email || '';
                // You could also fetch patient name from Supabase here
            }
        });
    </script>
