<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Doctors - Wellmeadows</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #f1f5f9; }

        .sidebar {
            position: fixed; top: 0; left: 0; height: 100%; width: 280px;
            background: linear-gradient(180deg, #0f2b3d 0%, #0a1e2c 100%);
            color: #e2e8f0; transition: all 0.3s; z-index: 100; overflow-y: auto;
        }
        .sidebar.closed { width: 80px; }
        .sidebar.closed .sidebar-nav span, .sidebar.closed .logo-text, 
        .sidebar.closed .logo-sub, .sidebar.closed .user-details { display: none; }
        .sidebar-header { padding: 24px; border-bottom: 1px solid rgba(255,255,255,0.08); }
        .logo-area { display: flex; align-items: center; gap: 12px; }
        .logo-icon { font-size: 1.5rem; font-weight: 700; color: #4db8ff; }
        .logo-text { font-size: 1.3rem; font-weight: 700; color: white; }
        .logo-sub { font-size: 0.7rem; color: #94a3b8; margin-top: 6px; padding-left: 52px; }
        .toggle-btn {
            position: absolute; top: 20px; right: -12px; background: #287b9e;
            border: 2px solid #0f2b3d; border-radius: 50%; width: 28px; height: 28px;
            display: flex; align-items: center; justify-content: center; cursor: pointer;
            color: white; z-index: 101;
        }
        .sidebar-nav { padding: 0 16px; display: flex; flex-direction: column; gap: 8px; }
        .nav-item {
            display: flex; align-items: center; gap: 14px; padding: 12px 16px;
            border-radius: 12px; color: #cbd5e6; text-decoration: none;
            font-weight: 500; font-size: 0.9rem; transition: all 0.2s;
        }
        .nav-item:hover { background: rgba(77,184,255,0.12); color: white; }
        .nav-item.active { background: #287b9e; color: white; }
        .sidebar-footer {
            position: absolute; bottom: 0; left: 0; right: 0; padding: 20px;
            border-top: 1px solid rgba(255,255,255,0.08);
        }
        .user-info { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
        .user-avatar { width: 40px; height: 40px; background: #287b9e; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; }
        .user-name { font-weight: 600; font-size: 0.85rem; color: white; }
        .logout-btn {
            width: 100%; background: rgba(220,38,38,0.2); border: none; color: #fca5a5;
            padding: 10px; border-radius: 10px; cursor: pointer;
        }
        .logout-btn:hover { background: rgba(220,38,38,0.4); color: white; }

        .main-content { margin-left: 280px; padding: 24px 32px; transition: all 0.3s; min-height: 100vh; }
        .main-content.expanded { margin-left: 80px; }
        .top-header { margin-bottom: 32px; }
        .top-header h1 { font-size: 1.8rem; font-weight: 700; color: #0f2b3d; margin-bottom: 8px; }

        .doctors-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 24px; }
        .doctor-card {
            background: white; border-radius: 20px; padding: 24px; border: 1px solid #e2e8f0;
            transition: all 0.2s; text-align: center;
        }
        .doctor-card:hover { transform: translateY(-4px); box-shadow: 0 8px 20px rgba(0,0,0,0.1); border-color: #287b9e; }
        .doctor-avatar { width: 80px; height: 80px; background: #eef2ff; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; font-size: 2rem; }
        .doctor-name { font-size: 1.1rem; font-weight: 700; color: #0f2b3d; margin-bottom: 4px; }
        .doctor-specialty { color: #287b9e; font-size: 0.85rem; margin-bottom: 12px; }
        .doctor-desc { color: #64748b; font-size: 0.8rem; margin-bottom: 16px; }
        .btn-book { background: #287b9e; color: white; border: none; padding: 8px 20px; border-radius: 40px; font-weight: 600; cursor: pointer; }
        .btn-book:hover { background: #1a5f7a; }

        @media (max-width: 768px) {
            .sidebar { width: 80px; }
            .sidebar .logo-text, .sidebar .logo-sub, .sidebar .user-details { display: none; }
            .sidebar .nav-item { justify-content: center; padding: 12px; }
            .sidebar .nav-item span { display: none; }
            .main-content { margin-left: 80px; padding: 20px; }
            .doctors-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<aside class="sidebar" id="sidebar">
    <div class="toggle-btn" id="toggleSidebar">〈</div>
    <div class="sidebar-header">
        <div class="logo-area"><div class="logo-icon">🏥</div><div class="logo-text">Wellmeadows</div></div>
        <div class="logo-sub">Patient Portal</div>
    </div>
    <nav class="sidebar-nav">
        <a href="index.html" class="nav-item"><span>Dashboard</span></a>
        <a href="book-appointment.html" class="nav-item"><span>Book Appointment</span></a>
        <a href="my-appointments.html" class="nav-item"><span>My Appointments</span></a>
        <a href="doctors.html" class="nav-item active"><span>Our Doctors</span></a>
        <a href="medical-records.html" class="nav-item"><span>Medical Records</span></a>
        <a href="payment.html" class="nav-item"><span>Payments</span></a>
    </nav>
    <div class="sidebar-footer">
        <div class="user-info"><div class="user-avatar">👤</div><div class="user-details"><div class="user-name" id="userName">Patient</div></div></div>
        <button class="logout-btn" id="logoutBtn">Logout</button>
    </div>
</aside>

<main class="main-content" id="mainContent">
    <div class="top-header"><h1>Our Medical Team</h1><p>Meet our experienced doctors and specialists</p></div>
    <div class="doctors-grid" id="doctorsList"></div>
</main>

<script type="module">
    import { auth, onAuthStateChanged, signOut } from './assets/js/firebase-config.js';

    const doctors = [
        { name: 'Dr. Kian Gape', specialty: 'General Medicine', experience: '12 years', education: 'University of Santo Tomas' },
        { name: 'Dr. Allyza Espragera', specialty: 'Cardiology', experience: '15 years', education: 'University of the Philippines' },
        { name: 'Dr. Mary Nyl Toreta', specialty: 'Pediatrics', experience: '10 years', education: 'Ateneo de Manila University' },
        { name: 'Dr. Juhaiber Macadato', specialty: 'General Surgery', experience: '18 years', education: 'University of Santo Tomas' },
        { name: 'Dr. Jennifer Barnedo', specialty: 'Internal Medicine', experience: '20 years', education: 'University of the Philippines' }
    ];

    function renderDoctors() {
        const container = document.getElementById('doctorsList');
        container.innerHTML = doctors.map(doc => `
            <div class="doctor-card">
                <div class="doctor-avatar">👨‍⚕️</div>
                <div class="doctor-name">${doc.name}</div>
                <div class="doctor-specialty">${doc.specialty}</div>
                <div class="doctor-desc">${doc.experience} experience<br>${doc.education}</div>
                <button class="btn-book" onclick="bookDoctor('${doc.name}', '${doc.specialty}')">Book Appointment</button>
            </div>
        `).join('');
    }

    window.bookDoctor = (name, specialty) => {
        window.location.href = `book-appointment.html?doctor=${encodeURIComponent(name)}&specialty=${encodeURIComponent(specialty)}`;
    };

    const sidebar = document.getElementById('sidebar');
    const mainContent = document.getElementById('mainContent');
    document.getElementById('toggleSidebar').addEventListener('click', () => {
        sidebar.classList.toggle('closed');
        mainContent.classList.toggle('expanded');
    });

    document.getElementById('logoutBtn').addEventListener('click', async () => { await signOut(auth); window.location.href = 'login.html'; });

    onAuthStateChanged(auth, (user) => {
        if (!user) { window.location.href = 'login.html'; return; }
        renderDoctors();
    });
</script>
</body>
</html>
